<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Cyber Dodge: Overdrive</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      touch-action: none; 
      user-select: none;
      -webkit-user-select: none;
    }
    body { 
      background: #04060a; 
      overflow: hidden; 
      font-family: 'Courier New', Courier, monospace; 
    }
    canvas { 
      display: block; 
      width: 100vw; 
      height: 100vh; 
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ==========================================
    // --- SYNTEZATOR AUDIO & DYNAMICZNA MUZYKA ---
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // UNIKATOWE BRZMIENIE DLA KAŻDEJ Z 5 BRONI
    function playLaserSound(lvl = 1) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (lvl === 1) {
        // Poziom 1: Klasyczny, szybki laser saw
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.05);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (lvl === 2) {
        // Poziom 2: Podwójny impuls metaliczny (square dual-tone)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(990, now);
        osc.frequency.setValueAtTime(740, now + 0.02);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.06);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.004, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (lvl === 3) {
        // Poziom 3: Rozproszona plazma (triangle wave + basowy sweep)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.07);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.008, now + 0.07);
        osc.start(now);
        osc.stop(now + 0.07);
      } else if (lvl === 4) {
        // Poziom 4: Ciężkie działo odłamkowe (rezonansowy spadek częstotliwości)
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.exponentialRampToValueAtTime(150, now + 0.08);
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.08);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else {
        // Poziom 5: Overdrive Hyper-Beam (przeszywający syntetyczny pisk)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1480, now);
        osc.frequency.exponentialRampToValueAtTime(240, now + 0.05);
        gain.gain.setValueAtTime(0.13, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    }

    function playEnemyShootSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(380, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playHitSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(340, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.10, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playExplodeSound(heavy = false) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sawtooth';
      const startFreq = heavy ? 140 : 210;
      const duration = heavy ? 0.32 : 0.18;
      osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(22, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(heavy ? 0.32 : 0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // UNIKATOWY JINGLE DLA KAŻDEGO POZIOMU ULEPSZENIA
    function playPowerupSound(lvl = 2) {
      if (!audioCtx) return;
      const notesByLevel = {
        2: [440, 659],                          // Duet A4 -> E5
        3: [440, 554, 659],                     // Trójdźwięk A-dur
        4: [440, 554, 659, 880],                // Czterodźwięk do oktawy A5
        5: [523, 659, 783, 1046, 1318]          // Pełna fanfara Overdrive (C-E-G-C-E)
      };

      const notes = notesByLevel[lvl] || [523, 659, 783, 1046];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = lvl === 5 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.05);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.05 + 0.12);
        osc.start(audioCtx.currentTime + idx * 0.05);
        osc.stop(audioCtx.currentTime + idx * 0.05 + 0.12);
      });
    }

    function playBossAlarm() {
      if (!audioCtx) return;
      for (let i = 0; i < 3; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(420, audioCtx.currentTime + i * 0.22);
        osc.frequency.exponentialRampToValueAtTime(780, audioCtx.currentTime + i * 0.22 + 0.18);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime + i * 0.22);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.22 + 0.2);
        osc.start(audioCtx.currentTime + i * 0.22);
        osc.stop(audioCtx.currentTime + i * 0.22 + 0.2);
      }
    }

    function playKeySound(pitchMod = 1) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime((1200 + Math.random() * 200) * pitchMod, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.025);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.025);
    }

    function playBtnSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    // --- PROCEDURALNY MOTOR MUZYCZNY SYNTHWAVE ---
    const MusicEngine = {
      isPlaying: false,
      step: 0,
      nextNoteTime: 0,
      tempo: 124,
      isBoss: false,
      seqSector1: [55, 55, 110, 55, 65.4, 55, 73.4, 55, 55, 55, 110, 82.4, 65.4, 73.4, 55, 82.4],
      seqSector2: [48.9, 48.9, 98, 48.9, 58.2, 48.9, 65.4, 48.9, 48.9, 48.9, 98, 73.4, 58.2, 65.4, 48.9, 73.4],
      seqBoss: [65.4, 65.4, 130.8, 65.4, 77.8, 65.4, 87.3, 98, 65.4, 65.4, 130.8, 98, 77.8, 87.3, 65.4, 116.5],
      arp: [220, 0, 261.6, 0, 329.6, 0, 440, 329.6, 220, 0, 293.7, 0, 349.2, 0, 440, 523.2],

      start() {
        this.isPlaying = true;
        this.step = 0;
        if (audioCtx) this.nextNoteTime = audioCtx.currentTime + 0.05;
      },

      stop() {
        this.isPlaying = false;
      },

      update() {
        if (!this.isPlaying || !audioCtx) return;

        const currentBpm = this.isBoss ? 138 : this.tempo;
        const secondsPerStep = (60 / currentBpm) / 4;

        while (this.nextNoteTime < audioCtx.currentTime + 0.1) {
          this.scheduleStep(this.nextNoteTime, this.step);
          this.nextNoteTime += secondsPerStep;
          this.step = (this.step + 1) % 16;
        }
      },

      scheduleStep(time, stepIdx) {
        let bassSeq = currentSectorIndex % 2 === 0 ? this.seqSector1 : this.seqSector2;
        if (this.isBoss) bassSeq = this.seqBoss;

        const freq = bassSeq[stepIdx];
        if (freq > 0) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();

          osc.type = this.isBoss ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(freq, time);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(this.isBoss ? 800 : 450, time);
          filter.frequency.exponentialRampToValueAtTime(120, time + 0.12);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          gain.gain.setValueAtTime(this.isBoss ? 0.13 : 0.09, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.13);

          osc.start(time);
          osc.stop(time + 0.13);
        }

        if (stepIdx % 2 === 0 && !this.isBoss) {
          const arpFreq = this.arp[stepIdx];
          if (arpFreq > 0) {
            const arpOsc = audioCtx.createOscillator();
            const arpGain = audioCtx.createGain();
            arpOsc.type = 'sine';
            arpOsc.frequency.setValueAtTime(arpFreq, time);
            arpOsc.connect(arpGain);
            arpGain.connect(audioCtx.destination);
            arpGain.gain.setValueAtTime(0.025, time);
            arpGain.gain.exponentialRampToValueAtTime(0.001, time + 0.10);
            arpOsc.start(time);
            arpOsc.stop(time + 0.10);
          }
        }
      }
    };

    // ==========================================
    // --- STAN GRY, SEKTORY I GRACZ ---
    // ==========================================
    const DEFAULT_CAMPAIGN = [
      {
        id: 1,
        name: "SEKTOR 01: PERYMETR ROJU",
        duration: 44,
        color: "#00ffcc",
        hasAsteroids: false,
        cutscene: {
          illustration: "briefing",
          lines: [
            "SYSTEMY BOJOWE: ONLINE. SEKTOR 01.",
            "ALARM: Formacja wrogich dronów naruszyła perymetr!",
            "ROZKAZ: Zniszcz wrogów i flagowy rdzeń TITAN-PRIME.",
            "WSKAZÓWKA: Przechwytuj kontenery zasobów z transporterów!"
          ]
        },
        boss: {
          name: "TITAN-PRIME [RDZEŃ 01]",
          hp: 120,
          color: "#ff0055",
          speedX: 2.2,
          shootRate: 55,
          phase2Threshold: 0.5
        }
      },
      {
        id: 2,
        name: "SEKTOR 02: PAS ASTEROID",
        duration: 48,
        color: "#00ff88",
        hasAsteroids: true,
        cutscene: {
          illustration: "sector2_debrief",
          lines: [
            "TITAN-PRIME ZNISZCZONY! SEKTOR 01 CZYSTY.",
            "ALARM: Niedobitki floty uciekają w Pas Asteroid.",
            "ROZKAZ: Oczyść Sektor 02. Uwaga na gęsty gruz!",
            "SKOK HIPERPRZESTRZENNY ZA 3... 2... 1..."
          ]
        },
        boss: {
          name: "DREADNOUGHT VEX",
          hp: 180,
          color: "#ff9900",
          speedX: 2.6,
          shootRate: 46,
          phase2Threshold: 0.5
        }
      }
    ];

    let campaign = JSON.parse(JSON.stringify(DEFAULT_CAMPAIGN));
    let currentSectorIndex = 0;
    let isCustomCampaignLoaded = false;

    function loadCampaignFromHash() {
      try {
        if (window.location.hash.startsWith('#campaign=')) {
          const raw = decodeURIComponent(window.location.hash.substring(10));
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            campaign = parsed;
            isCustomCampaignLoaded = true;
          }
        }
      } catch (err) {
        console.warn('Błąd ładowania kampanii z URL:', err);
      }
    }
    loadCampaignFromHash();

    function getCurSector() {
      return campaign[currentSectorIndex] || campaign[0];
    }

    const WARMUP_DURATION = 2.4;

    const player = {
      x: canvas.width / 2,
      y: canvas.height * 0.78,
      radius: 17,
      color: '#00ffcc',
      weaponLevel: 1,
      maxWeaponLevel: 5
    };

    const UPGRADE_MILESTONES = [
      { targetTier: 2, triggerProgress: 0.20, triggered: false },
      { targetTier: 3, triggerProgress: 0.40, triggered: false },
      { targetTier: 4, triggerProgress: 0.60, triggered: false },
      { targetTier: 5, triggerProgress: 0.80, triggered: false }
    ];

    let state = 'SPLASH';
    let splashAlpha = 0;
    let splashBtnBounds = { x: 0, y: 0, w: 0, h: 0 };
    let editorBtnBounds = { x: 0, y: 0, w: 0, h: 0 };
    let isGodMode = false;
    let godModeBtnBounds = { x: 0, y: 0, w: 0, h: 0 };
    let stars = [];

    for (let i = 0; i < 55; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random(),
        speed: Math.random() * 0.5 + 0.2,
        size: Math.random() * 1.8 + 0.8
      });
    }

    // ==========================================
    // --- UNIWERSALNY SYSTEM CUTSCENEK (Z ZAWIJANIEM TEKSTU) ---
    // ==========================================
    function getWrappedLines(context, text, maxWidth) {
      const words = text.split(' ');
      const lines = [];
      let current = '';

      for (let i = 0; i < words.length; i++) {
        const word = words[i];
        const testLine = current ? current + ' ' + word : word;
        if (context.measureText(testLine).width > maxWidth && current) {
          lines.push(current);
          current = word;
        } else {
          current = testLine;
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    const CutsceneSystem = {
      illustration: 'briefing',
      lines: [],
      currentLineIndex: 0,
      displayedText: '',
      charIndex: 0,
      charTimer: 0,
      charInterval: 0.022,
      isLineComplete: false,
      onComplete: null,

      start(config) {
        this.illustration = config.illustration || 'briefing';
        this.lines = config.lines || [];
        this.currentLineIndex = 0;
        this.displayedText = '';
        this.charIndex = 0;
        this.charTimer = 0;
        this.isLineComplete = false;
        this.onComplete = config.onComplete || null;
        MusicEngine.stop();
        state = 'CUTSCENE';
      },

      onTap() {
        if (!this.isLineComplete) {
          this.displayedText = this.lines[this.currentLineIndex];
          this.charIndex = this.displayedText.length;
          this.isLineComplete = true;
          playKeySound(1.3);
        } else {
          if (this.currentLineIndex < this.lines.length - 1) {
            this.currentLineIndex++;
            this.displayedText = '';
            this.charIndex = 0;
            this.isLineComplete = false;
            playKeySound(1.0);
          } else {
            playBtnSound();
            if (this.onComplete) this.onComplete();
          }
        }
      },

      update(dt) {
        if (this.isLineComplete) return;
        const target = this.lines[this.currentLineIndex] || '';
        this.charTimer += dt;

        while (this.charTimer >= this.charInterval && this.charIndex < target.length) {
          this.charTimer -= this.charInterval;
          this.charIndex++;
          this.displayedText = target.substring(0, this.charIndex);
          if (this.charIndex % 2 === 0) playKeySound(0.9 + Math.random() * 0.2);
        }

        if (this.charIndex >= target.length) {
          this.isLineComplete = true;
        }
      },

      render(ctx, width, height, now) {
        ctx.fillStyle = '#04060a';
        ctx.fillRect(0, 0, width, height);

        const illusHeight = Math.min(height * 0.40, 240);

        // 1. GÓRNA POŁOWA: ILUSTRACJA TAKTYCZNA
        ctx.save();
        ctx.beginPath();
        ctx.rect(14, 14, width - 28, illusHeight);
        ctx.clip();

        const activeSec = getCurSector();
        ctx.fillStyle = currentSectorIndex % 2 === 1 ? '#0b130e' : '#080d18';
        ctx.fillRect(14, 14, width - 28, illusHeight);

        const activeColor = activeSec.color || '#00ffcc';
        const gridColor = `${activeColor}22`;
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        const gridStep = 28;
        for (let x = 14; x < width - 14; x += gridStep) {
          ctx.beginPath();
          ctx.moveTo(x, 14);
          ctx.lineTo(x, 14 + illusHeight);
          ctx.stroke();
        }
        for (let y = 14; y < 14 + illusHeight; y += gridStep) {
          ctx.beginPath();
          ctx.moveTo(14, y);
          ctx.lineTo(width - 14, y);
          ctx.stroke();
        }

        const centerX = width / 2;
        const centerY = 14 + illusHeight / 2;

        if (this.illustration === 'briefing') {
          ctx.strokeStyle = 'rgba(0, 229, 255, 0.35)';
          ctx.beginPath();
          ctx.arc(centerX, centerY, 48, 0, Math.PI * 2);
          ctx.arc(centerX, centerY, 90, 0, Math.PI * 2);
          ctx.stroke();

          const sweepAngle = (now * 0.0024) % (Math.PI * 2);
          ctx.strokeStyle = activeColor;
          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.lineTo(centerX + Math.cos(sweepAngle) * 98, centerY + Math.sin(sweepAngle) * 98);
          ctx.stroke();

          ctx.strokeStyle = '#ff0055';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#ff0055';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(centerX, centerY - 32);
          ctx.lineTo(centerX + 40, centerY + 18);
          ctx.lineTo(centerX + 15, centerY + 13);
          ctx.lineTo(centerX, centerY + 28);
          ctx.lineTo(centerX - 15, centerY + 13);
          ctx.lineTo(centerX - 40, centerY + 18);
          ctx.closePath();
          ctx.stroke();
          ctx.shadowBlur = 0;
        } else if (this.illustration === 'sector2_debrief') {
          ctx.strokeStyle = '#ffbb00';
          ctx.lineWidth = 2;
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#ffbb00';
          for (let a = 0; a < 6; a++) {
            const ax = centerX + Math.cos(a * 1.05 + now * 0.001) * (45 + a * 10);
            const ay = centerY + Math.sin(a * 1.05 + now * 0.001) * (26 + a * 6);
            ctx.strokeRect(ax - 7, ay - 7, 14, 14);
          }
          ctx.shadowBlur = 0;
        } else if (this.illustration === 'ai_core') {
          ctx.strokeStyle = '#bf00ff';
          ctx.lineWidth = 2;
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(now * 0.0015);
          ctx.strokeRect(-38, -38, 76, 76);
          ctx.rotate(-now * 0.003);
          ctx.strokeRect(-22, -22, 44, 44);
          ctx.restore();
        }

        ctx.fillStyle = activeColor;
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`// RADAR TAKTYCZNY: SEKTOR 0${currentSectorIndex + 1}`, 26, 32);
        ctx.fillStyle = '#ff0055';
        ctx.textAlign = 'right';
        ctx.fillText('STATUS: AKTYWNY', width - 26, 32);

        ctx.restore();

        ctx.strokeStyle = activeColor;
        ctx.lineWidth = 2;
        ctx.strokeRect(14, 14, width - 28, illusHeight);

        // 2. DOLNA POŁOWA: KONSOLA PROMPTU (Z ZAWIJANIEM WIERSZY)
        const termY = 14 + illusHeight + 14;
        const termH = height - termY - 18;

        ctx.fillStyle = '#020408';
        ctx.fillRect(14, termY, width - 28, termH);
        ctx.strokeStyle = '#182b3a';
        ctx.strokeRect(14, termY, width - 28, termH);

        ctx.fillStyle = '#0a1722';
        ctx.fillRect(14, termY, width - 28, 24);
        ctx.fillStyle = '#00e5ff';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('> KONSOLA TAKTYCZNA // DOWÓDZTWO', 24, termY + 16);

        const startX = 24;
        let lineY = termY + 46;
        const lineHeight = 20;
        const maxTextWidth = width - 28 - 28; // Bezpieczny margines boczny

        ctx.font = '12px monospace';

        // Wyświetlanie zakończonych linijek z podziałem wierszy
        for (let i = 0; i < this.currentLineIndex; i++) {
          ctx.fillStyle = 'rgba(0, 255, 204, 0.40)';
          const wrapped = getWrappedLines(ctx, '> ' + this.lines[i], maxTextWidth);
          for (let w = 0; w < wrapped.length; w++) {
            ctx.fillText(wrapped[w], startX, lineY);
            lineY += lineHeight;
          }
        }

        // Wyświetlanie obecnie wpisywanej linijki z kursorem
        ctx.fillStyle = '#00ffcc';
        const cursor = Math.floor(now / 350) % 2 === 0 ? '█' : ' ';
        const currentWrapped = getWrappedLines(ctx, '> ' + this.displayedText, maxTextWidth);

        for (let j = 0; j < currentWrapped.length; j++) {
          const isLastSubLine = j === currentWrapped.length - 1;
          ctx.fillText(currentWrapped[j] + (isLastSubLine ? cursor : ''), startX, lineY);
          lineY += lineHeight;
        }

        ctx.textAlign = 'center';
        ctx.fillStyle = this.isLineComplete ? '#ffea00' : 'rgba(255, 234, 0, 0.45)';
        ctx.font = 'bold 11px monospace';
        const promptText = this.currentLineIndex === this.lines.length - 1 && this.isLineComplete 
          ? '[ DOTKNIJ, ABY POTWIERDZIĆ ROZKAZ ▶ ]' 
          : '[ DOTKNIJ, ABY KONTYNUOWAĆ ▶ ]';
        ctx.fillText(promptText, width / 2, termY + termH - 14);
      }
    };

    // ==========================================
    // --- BYTY GRY: POCISKI, WROGOWIE, BOSS ---
    // ==========================================
    let warmupTimer = WARMUP_DURATION;
    let levelTimer = 0;
    let enemiesKilled = 0;
    let targetTierNeeded = 2;
    let retryUpgradeTimer = 0;
    const RETRY_DELAY = 5.0;

    let enemies = [];
    let bullets = [];
    let enemyBullets = [];
    let particles = [];
    let pickups = [];
    let floatingTexts = [];
    let asteroids = [];

    let score = 0;
    let highScore = parseInt(localStorage.getItem('cyber_dodge_hi') || 0);

    let spawnTimer = 0;
    let asteroidTimer = 0;
    let shootTimer = 0;
    let screenShake = 0;
    let bossWarningTimer = 0;

    let isTouching = false;
    let lastTouchX = 0;
    let lastTouchY = 0;
    let lastTapTime = 0;

    let boss = null;

    function spawnBoss() {
      bossWarningTimer = 2.8;
      playBossAlarm();
      MusicEngine.isBoss = true;

      const bossHp = currentSector === 1 ? 120 : 180;
      boss = {
        x: canvas.width / 2,
        y: -90,
        targetY: 110,
        radius: 46,
        width: 96,
        height: 64,
        hp: bossHp,
        maxHp: bossHp,
        phase: 1,
        color: '#ff0055',
        speedX: 2.2,
        shootCooldown: 0,
        flash: 0,
        name: currentSector === 1 ? 'TITAN-PRIME [RDZEŃ 01]' : 'DREADNOUGHT VEX'
      };
    }

    function onTouchStart(e) {
      if (e.type === 'mousedown' && performance.now() - lastTapTime < 300) return;
      if (e.type === 'touchstart') lastTapTime = performance.now();

      e.preventDefault();
      initAudio();

      const touch = e.touches ? e.touches[0] : e;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = (touch.clientX - rect.left) * scaleX;
      const clientY = (touch.clientY - rect.top) * scaleY;

      if (state === 'SPLASH') {
        const eb = editorBtnBounds;
        if (clientX >= eb.x && clientX <= eb.x + eb.w && clientY >= eb.y && clientY <= eb.y + eb.h) {
          playBtnSound();
          window.location.href = 'editor.html';
          return;
        }

        const gb = godModeBtnBounds;
        if (clientX >= gb.x && clientX <= gb.x + gb.w && clientY >= gb.y && clientY <= gb.y + gb.h) {
          isGodMode = !isGodMode;
          playBtnSound();
          return;
        }

        const b = splashBtnBounds;
        if (clientX >= b.x && clientX <= b.x + b.w && clientY >= b.y && clientY <= b.y + b.h) {
          playBtnSound();
          startSectorCutscene(0);
        }
        return;
      }

      if (state === 'CUTSCENE') {
        CutsceneSystem.onTap();
        return;
      }

      if (state === 'WON' || state === 'GAMEOVER') {
        currentSectorIndex = 0;
        resetGame();
        return;
      }

      const touch = e.touches ? e.touches[0] : e;
      isTouching = true;
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }

    function onTouchMove(e) {
      e.preventDefault();
      if (!isTouching) return;

      const touch = e.touches ? e.touches[0] : e;
      const dx = touch.clientX - lastTouchX;
      const dy = touch.clientY - lastTouchY;

      player.x += dx;
      player.y += dy;

      player.x = Math.max(player.radius + 6, Math.min(canvas.width - player.radius - 6, player.x));
      player.y = Math.max(player.radius + 50, Math.min(canvas.height - player.radius - 20, player.y));

      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }

    function onTouchEnd(e) {
      e.preventDefault();
      isTouching = false;
    }

    window.addEventListener('touchstart', onTouchStart, { passive: false });
    window.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('touchend', onTouchEnd, { passive: false });
    window.addEventListener('mousedown', onTouchStart);
    window.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);

    function resetGame() {
      enemies = [];
      bullets = [];
      enemyBullets = [];
      particles = [];
      pickups = [];
      floatingTexts = [];
      asteroids = [];
      boss = null;
      score = 0;
      levelTimer = 0;
      enemiesKilled = 0;
      warmupTimer = WARMUP_DURATION;
      state = 'WARMUP';
      player.weaponLevel = 1;
      targetTierNeeded = 2;
      retryUpgradeTimer = 0;
      bossWarningTimer = 0;
      spawnTimer = 0;
      asteroidTimer = 0;
      currentSectorIndex = 0;

      UPGRADE_MILESTONES.forEach(m => m.triggered = false);

      player.x = canvas.width / 2;
      player.y = canvas.height * 0.78;
      isTouching = false;

      MusicEngine.isBoss = false;
      MusicEngine.start();
    }

    function advanceToNextSector() {
      enemies = [];
      bullets = [];
      enemyBullets = [];
      particles = [];
      pickups = [];
      floatingTexts = [];
      asteroids = [];
      boss = null;
      levelTimer = 0;
      warmupTimer = WARMUP_DURATION;
      targetTierNeeded = Math.min(5, player.weaponLevel + 1);
      retryUpgradeTimer = 0;
      bossWarningTimer = 0;
      spawnTimer = 0;
      asteroidTimer = 0;

      UPGRADE_MILESTONES.forEach(m => {
        m.triggered = player.weaponLevel >= m.targetTier;
      });

      player.x = canvas.width / 2;
      player.y = canvas.height * 0.78;
      isTouching = false;

      MusicEngine.isBoss = false;
      startSectorCutscene(currentSectorIndex);
    }

    function shootWeapons() {
      const lvl = player.weaponLevel;
      const px = player.x;
      const py = player.y - player.radius;

      playLaserSound(lvl);

      if (lvl === 1) {
        bullets.push({ x: px, y: py, vx: 0, vy: -15, damage: 1, color: '#00ffff', radius: 3, canFragment: false });
      } else if (lvl === 2) {
        bullets.push({ x: px - 8, y: py, vx: 0, vy: -15, damage: 1, color: '#00ffff', radius: 3, canFragment: false });
        bullets.push({ x: px + 8, y: py, vx: 0, vy: -15, damage: 1, color: '#00ffff', radius: 3, canFragment: false });
      } else if (lvl === 3) {
        bullets.push({ x: px, y: py, vx: 0, vy: -15, damage: 1, color: '#00ffff', radius: 3.5, canFragment: false });
        bullets.push({ x: px - 9, y: py, vx: -2.8, vy: -14.5, damage: 1, color: '#33ffaa', radius: 3, canFragment: false });
        bullets.push({ x: px + 9, y: py, vx: 2.8, vy: -14.5, damage: 1, color: '#33ffaa', radius: 3, canFragment: false });
      } else if (lvl === 4) {
        bullets.push({ x: px, y: py, vx: 0, vy: -15, damage: 1.5, color: '#ffea00', radius: 4.5, canFragment: true });
        bullets.push({ x: px - 11, y: py, vx: -3.2, vy: -14, damage: 1, color: '#ff9900', radius: 3.5, canFragment: false });
        bullets.push({ x: px + 11, y: py, vx: 3.2, vy: -14, damage: 1, color: '#ff9900', radius: 3.5, canFragment: false });
      } else if (lvl >= 5) {
        bullets.push({ x: px, y: py, vx: 0, vy: -16, damage: 2, color: '#ff00ff', radius: 5, canFragment: true });
        bullets.push({ x: px - 7, y: py, vx: -2.2, vy: -15.5, damage: 1.2, color: '#00ffff', radius: 3.5, canFragment: true });
        bullets.push({ x: px + 7, y: py, vx: 2.2, vy: -15.5, damage: 1.2, color: '#00ffff', radius: 3.5, canFragment: true });
        bullets.push({ x: px - 14, y: py, vx: -5.0, vy: -13.5, damage: 1, color: '#ffea00', radius: 3, canFragment: false });
        bullets.push({ x: px + 14, y: py, vx: 5.0, vy: -13.5, damage: 1, color: '#ffea00', radius: 3, canFragment: false });
      }
    }

    function fragmentBullet(x, y) {
      const angles = [Math.PI * 0.25, Math.PI * 0.75, Math.PI * 1.25, Math.PI * 1.75];
      for (const a of angles) {
        bullets.push({
          x: x,
          y: y,
          vx: Math.cos(a) * 9,
          vy: Math.sin(a) * 9,
          damage: 1,
          color: '#ffea00',
          radius: 2.5,
          canFragment: false,
          isShard: true,
          life: 25
        });
      }
    }

    function fireEnemyBullet(x, y, vx, vy, color = '#ff3366') {
      enemyBullets.push({ x, y, vx, vy, radius: 4, color });
      playEnemyShootSound();
    }

    function spawnUpgradeCarrier() {
      addFloatingText('! TRANSPORTER ZASOBÓW !', canvas.width / 2, 70, '#00ffff');
      enemies.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: -35,
        radius: 22,
        speed: 2.2,
        hp: 5,
        maxHp: 5,
        color: '#00e5ff',
        type: 'carrier',
        scoreVal: 250,
        flash: 0,
        hasUpgrade: true,
        shootCooldown: 999
      });
    }

    function spawnRegularEnemy(forceType = null) {
      const rand = Math.random();
      let enemy = {};

      let type = forceType;
      if (!type) {
        if (rand < 0.54) type = 'scout';
        else if (rand < 0.84) type = 'cruiser';
        else type = 'titan';
      }

      if (type === 'scout') {
        enemy = {
          x: Math.random() * (canvas.width - 40) + 20,
          y: -25,
          radius: 12,
          speed: 4.8 + Math.random() * 1.2 + (levelTimer / 30),
          hp: 1,
          maxHp: 1,
          color: '#ffaa00',
          type: 'scout',
          scoreVal: 50,
          flash: 0,
          hasUpgrade: false,
          shootCooldown: 999
        };
      } else if (type === 'cruiser') {
        enemy = {
          x: Math.random() * (canvas.width - 50) + 25,
          y: -30,
          radius: 18,
          speed: 3.1 + Math.random() * 0.7,
          hp: 3,
          maxHp: 3,
          color: '#ff0055',
          type: 'cruiser',
          scoreVal: 130,
          flash: 0,
          hasUpgrade: false,
          shootCooldown: Math.random() * 40 + 35
        };
      } else {
        enemy = {
          x: Math.random() * (canvas.width - 60) + 30,
          y: -40,
          radius: 25,
          speed: 2.0 + Math.random() * 0.5,
          hp: 7,
          maxHp: 7,
          color: '#bf00ff',
          type: 'titan',
          scoreVal: 320,
          flash: 0,
          hasUpgrade: false,
          shootCooldown: Math.random() * 50 + 50
        };
      }

      enemies.push(enemy);
    }

    function spawnAsteroid() {
      const size = Math.random() * 16 + 18;
      asteroids.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: -40,
        radius: size,
        hp: Math.floor(size * 0.6),
        maxHp: Math.floor(size * 0.6),
        speed: Math.random() * 2.5 + 2.0,
        rot: 0,
        rotSpeed: (Math.random() - 0.5) * 0.04
      });
    }

    function createExplosion(x, y, color, count = 15, heavy = false) {
      screenShake = heavy ? 16 : 8;
      playExplodeSound(heavy);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * (heavy ? 7.5 : 5.2) + 1.5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3.2 + 1.5,
          color: color,
          alpha: 1
        });
      }
    }

    function addFloatingText(text, x, y, color) {
      floatingTexts.push({ text, x, y, color, alpha: 1, vy: -1.2 });
    }

    // ==========================================
    // --- GŁÓWNA PĘTLA GRY ---
    // ==========================================
    let lastTimestamp = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTimestamp) / 1000, 0.1);
      lastTimestamp = now;

      MusicEngine.update();

      // Screen Shake
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.86;
        if (screenShake < 0.4) screenShake = 0;
      }

      // --- STAN: SPLASH SCREEN ---
      if (state === 'SPLASH') {
        splashAlpha = Math.min(1, splashAlpha + dt * 0.75);

        ctx.fillStyle = '#04060a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        stars.forEach(s => {
          s.y += s.speed * dt * 2.5;
          if (s.y > 1) s.y = 0;
          ctx.fillStyle = `rgba(0, 255, 204, ${0.3 * splashAlpha})`;
          ctx.beginPath();
          ctx.arc(s.x * canvas.width, s.y * canvas.height, s.size, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.save();
        ctx.globalAlpha = splashAlpha;

        ctx.textAlign = 'center';
        ctx.fillStyle = '#00ffcc';
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#00ffcc';
        ctx.font = '900 38px monospace';
        ctx.fillText('CYBER DODGE', canvas.width / 2, canvas.height * 0.38);

        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.font = 'bold 16px monospace';
        ctx.fillText('OVERDRIVE PROTOCOL', canvas.width / 2, canvas.height * 0.38 + 32);

        if (isCustomCampaignLoaded) {
          ctx.fillStyle = '#00ffcc';
          ctx.font = 'bold 11px monospace';
          ctx.shadowBlur = 0;
          ctx.fillText(`[ ZAŁADOWANO KAMPANIĘ: ${campaign.length} SEKTORÓW ]`, canvas.width / 2, canvas.height * 0.38 + 56);
        }

        if (splashAlpha > 0.4) {
          const btnW = Math.min(280, canvas.width - 60);
          const btnH = 54;
          ctx.fillStyle = 'rgba(0, 255, 204, 0.12)';
          ctx.fillRect(btnX, btnY, btnW, btnH);

          ctx.strokeStyle = '#00ffcc';
          ctx.lineWidth = 2.5;
          ctx.strokeRect(btnX, btnY, btnW, btnH);

          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 8;
          ctx.font = 'bold 16px monospace';
          ctx.fillText('ROZPOCZNIJ MISJĘ', canvas.width / 2, btnY + 31);

          // Przycisk Edytora Misji
          const edW = Math.min(280, canvas.width - 60);
          const edH = 36;
          const edX = (canvas.width - edW) / 2;
          const edY = btnY + btnH + 12;
          editorBtnBounds = { x: edX, y: edY, w: edW, h: edH };

          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(255, 0, 153, 0.12)';
          ctx.fillRect(edX, edY, edW, edH);
          ctx.strokeStyle = '#ff0099';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(edX, edY, edW, edH);

          ctx.fillStyle = '#ff88dd';
          ctx.font = 'bold 12px monospace';
          ctx.fillText('🛠 OTWÓRZ EDYTOR MISJI', canvas.width / 2, edY + 23);

          const devW = Math.min(260, canvas.width - 60);
          const devH = 38;
          const devX = (canvas.width - devW) / 2;
          const devY = edY + edH + 12;
          godModeBtnBounds = { x: devX, y: devY, w: devW, h: devH };

          ctx.shadowBlur = isGodMode ? 14 : 0;
          ctx.shadowColor = '#ffea00';
          ctx.fillStyle = isGodMode ? 'rgba(255, 234, 0, 0.18)' : 'rgba(255, 255, 255, 0.05)';
          ctx.fillRect(devX, devY, devW, devH);

          ctx.strokeStyle = isGodMode ? '#ffea00' : 'rgba(255, 255, 255, 0.25)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(devX, devY, devW, devH);

          ctx.fillStyle = isGodMode ? '#ffea00' : '#8899aa';
          ctx.font = 'bold 11px monospace';
          ctx.fillText(`DEV INVINCIBLE: ${isGodMode ? '[ WŁĄCZONY ]' : '[ WYŁĄCZONY ]'}`, canvas.width / 2, devY + 22);
        }

        ctx.restore();
        ctx.restore();
        requestAnimationFrame(loop);
        return;
      }

      // --- STAN: CUTSCENKA ---
      if (state === 'CUTSCENE') {
        CutsceneSystem.update(dt);
        CutsceneSystem.render(ctx, canvas.width, canvas.height, now);
        ctx.restore();
        requestAnimationFrame(loop);
        return;
      }

      const curSector = getCurSector();
      const LEVEL_DURATION = curSector.duration || 44;
      const curColor = curSector.color || '#00ffcc';

      // Tło z motion blur dopasowane do barwy sektora
      ctx.fillStyle = 'rgba(4, 6, 10, 0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Gwiazdy
      stars.forEach(s => {
        s.y += s.speed * dt * (boss ? 0.8 : 2.5);
        if (s.y > 1) s.y = 0;
        ctx.fillStyle = `${curColor}40`;
        ctx.fillRect(s.x * canvas.width, s.y * canvas.height, s.size, s.size);
      });

      // --- LOGIKA ROZGRYWKI ---
      if (state === 'WARMUP') {
        warmupTimer -= dt;
        if (warmupTimer <= 0) {
          state = 'PLAYING';
          addFloatingText(`${curSector.name || 'SEKTOR'}: START!`, canvas.width / 2, canvas.height / 2, curColor);
        }
      } else if (state === 'PLAYING') {
        levelTimer += dt;
        shootTimer++;

        const waveProgress = Math.min(1, levelTimer / LEVEL_DURATION);
        const waveCompleted = levelTimer >= LEVEL_DURATION;

        // Auto-strzał gracza
        const shootRate = player.weaponLevel >= 4 ? 7 : 8;
        if (isTouching && shootTimer % shootRate === 0) {
          shootWeapons();
        }

        // 1. Spawnowanie Bossa po 100% czasu fali
        if (waveCompleted && !boss) {
          spawnBoss();
        }

        // 2. Harmonogram ulepszeń (tylko przed bossem)
        if (!waveCompleted && player.weaponLevel < player.maxWeaponLevel) {
          const hasCarrier = enemies.some(e => e.hasUpgrade);
          const hasPickup = pickups.length > 0;

          const nextMilestone = UPGRADE_MILESTONES.find(m => m.targetTier === targetTierNeeded);
          if (nextMilestone && !nextMilestone.triggered && waveProgress >= nextMilestone.triggerProgress) {
            nextMilestone.triggered = true;
            if (!hasCarrier && !hasPickup) spawnUpgradeCarrier();
          }

          if (retryUpgradeTimer > 0) {
            retryUpgradeTimer -= dt;
            if (retryUpgradeTimer <= 0 && !hasCarrier && !hasPickup) {
              addFloatingText('NOWY TRANSPORTER!', canvas.width / 2, 90, '#ffea00');
              spawnUpgradeCarrier();
            }
          }
        }

        // 3. Dynamiczne skalowanie roju
        if (!waveCompleted) {
          spawnTimer++;
          asteroidTimer++;

          const weaponReduction = (player.weaponLevel - 1) * 5.0;
          const progressReduction = waveProgress * 16.0;
          const currentSpawnInterval = Math.max(10, Math.round(46 - progressReduction - weaponReduction));

          if (spawnTimer >= currentSpawnInterval) {
            spawnTimer = 0;
            spawnRegularEnemy();

            let multiSpawnChance = 0;
            if (player.weaponLevel === 2) {
              multiSpawnChance = 0.15 + waveProgress * 0.15;
            } else if (player.weaponLevel === 3) {
              multiSpawnChance = 0.35 + waveProgress * 0.25;
            } else if (player.weaponLevel === 4) {
              multiSpawnChance = 0.55 + waveProgress * 0.30;
            } else if (player.weaponLevel >= 5) {
              multiSpawnChance = 0.75 + waveProgress * 0.20;
            }

            if (Math.random() < multiSpawnChance) {
              spawnRegularEnemy();
            }

            if (player.weaponLevel >= 5 && waveProgress > 0.45 && Math.random() < 0.45) {
              spawnRegularEnemy();
            }
          }

          if (curSector.hasAsteroids) {
            const asteroidInterval = Math.max(26, Math.round(65 - waveProgress * 22 - (player.weaponLevel - 1) * 3));
            if (asteroidTimer >= asteroidInterval) {
              asteroidTimer = 0;
              spawnAsteroid();
            }
          }
        }
      }

      // --- OBSŁUGA OSTRZEŻENIA PRZED BOSSEM ---
      if (bossWarningTimer > 0) {
        bossWarningTimer -= dt;
        ctx.save();
        ctx.fillStyle = `rgba(255, 0, 85, ${Math.sin(now * 0.015) * 0.25 + 0.25})`;
        ctx.fillRect(0, canvas.height * 0.22, canvas.width, 60);
        ctx.fillStyle = '#ff0055';
        ctx.textAlign = 'center';
        ctx.font = 'bold 20px monospace';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff0055';
        ctx.fillText('! OSTRZEŻENIE: TITAN WYKRYTY !', canvas.width / 2, canvas.height * 0.22 + 37);
        ctx.restore();
      }

      // --- LOGIKA I STRZELANIE BOSSA ---
      if (boss) {
        if (boss.y < boss.targetY) {
          boss.y += 1.8;
        } else {
          boss.x += boss.speedX;
          if (boss.x < boss.radius + 20 || boss.x > canvas.width - boss.radius - 20) {
            boss.speedX *= -1;
          }
        }

        if (boss.flash > 0) boss.flash--;

        const p2Thresh = boss.phase2Threshold || 0.5;
        if (boss.phase === 1 && boss.hp <= boss.maxHp * p2Thresh) {
          boss.phase = 2;
          boss.speedX *= 1.4;
          boss.color = '#ff9900';
          screenShake = 18;
          playBossAlarm();
          addFloatingText('BOSKI OVERDRIVE!', boss.x, boss.y + 40, '#ff0055');
        }

        boss.shootCooldown++;
        const baseInterval = boss.shootRate || (boss.phase === 2 ? 38 : 55);
        const bossShootInterval = boss.phase === 2 ? Math.round(baseInterval * 0.75) : baseInterval;

        if (boss.shootCooldown >= bossShootInterval && boss.y >= boss.targetY) {
          boss.shootCooldown = 0;

          if (boss.phase === 1) {
            fireEnemyBullet(boss.x - 25, boss.y + 20, -1.8, 5.5);
            fireEnemyBullet(boss.x, boss.y + 25, 0, 6.0);
            fireEnemyBullet(boss.x + 25, boss.y + 20, 1.8, 5.5);
          } else {
            const angles = [-0.6, -0.3, 0, 0.3, 0.6];
            angles.forEach(a => {
              fireEnemyBullet(boss.x, boss.y + 25, Math.sin(a) * 6, Math.cos(a) * 6, '#ff0055');
            });
          }
        }

        // Kadłub Bossa
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = boss.color;
        ctx.fillStyle = boss.flash > 0 ? '#ffffff' : boss.color;
        ctx.beginPath();
        ctx.moveTo(boss.x, boss.y + boss.height / 2);
        ctx.lineTo(boss.x + boss.width / 2, boss.y - boss.height / 2);
        ctx.lineTo(boss.x + boss.width * 0.2, boss.y - boss.height * 0.2);
        ctx.lineTo(boss.x, boss.y - boss.height * 0.4);
        ctx.lineTo(boss.x - boss.width * 0.2, boss.y - boss.height * 0.2);
        ctx.lineTo(boss.x - boss.width / 2, boss.y - boss.height / 2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.arc(boss.x, boss.y, 10 + Math.sin(now * 0.01) * 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Pasek HP Bossa
        const barW = canvas.width - 50;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(25, 62, barW, 9);
        ctx.fillStyle = boss.phase === 2 ? '#ff0055' : '#ff9900';
        ctx.fillRect(25, 62, barW * (Math.max(0, boss.hp) / boss.maxHp), 9);
        ctx.strokeStyle = '#ffffff';
        ctx.strokeRect(25, 62, barW, 9);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`BOSS: ${boss.name}`, 25, 57);

        // Kolizja pocisków gracza z Bossem
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const distBoss = Math.hypot(b.x - boss.x, b.y - boss.y);
          if (distBoss < boss.radius + b.radius) {
            boss.hp -= b.damage;
            boss.flash = 3;
            playHitSound();

            if (b.canFragment) fragmentBullet(b.x, b.y);
            bullets.splice(j, 1);

            if (boss.hp <= 0) {
              createExplosion(boss.x, boss.y, boss.color, 40, true);
              createExplosion(boss.x - 30, boss.y + 10, '#00ffff', 25, true);
              createExplosion(boss.x + 30, boss.y - 10, '#ffaa00', 25, true);
              score += 2500;
              boss = null;
              MusicEngine.stop();

              if (currentSectorIndex < campaign.length - 1) {
                currentSectorIndex++;
                advanceToNextSector();
              } else {
                state = 'WON';
                if (score > highScore) {
                  highScore = score;
                  localStorage.setItem('cyber_dodge_hi', highScore);
                }
              }
              break;
            }
          }
        }
      }

      // --- POCISKI WROGÓW ---
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = eb.color;
        ctx.fillStyle = eb.color;
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const dist = Math.hypot(player.x - eb.x, player.y - eb.y);
        if (dist < player.radius + eb.radius - 2) {
          if (!isGodMode) {
            createExplosion(player.x, player.y, player.color, 25, true);
            state = 'GAMEOVER';
            MusicEngine.stop();
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('cyber_dodge_hi', highScore);
            }
          } else {
            createExplosion(eb.x, eb.y, '#ffea00', 5, false);
            enemyBullets.splice(i, 1);
            continue;
          }
        }

        if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) {
          enemyBullets.splice(i, 1);
        }
      }

      // --- POCISKI GRACZA ---
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx || 0;
        b.y += b.vy;

        if (b.isShard) {
          b.life--;
          if (b.life <= 0) {
            bullets.splice(i, 1);
            continue;
          }
        }

        ctx.save();
        ctx.shadowBlur = 9;
        ctx.shadowColor = b.color;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (b.y < -30 || b.y > canvas.height + 30 || b.x < -30 || b.x > canvas.width + 30) {
          bullets.splice(i, 1);
        }
      }

      // --- ASTEROIDY (SEKTOR 2) ---
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const ast = asteroids[i];
        ast.y += ast.speed;
        ast.rot += ast.rotSpeed;

        ctx.save();
        ctx.translate(ast.x, ast.y);
        ctx.rotate(ast.rot);
        ctx.fillStyle = '#445544';
        ctx.strokeStyle = '#66aa77';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let j = 0; j < 8; j++) {
          const ang = (j / 8) * Math.PI * 2;
          const r = ast.radius * (0.8 + ((j % 3) * 0.15));
          const rx = Math.cos(ang) * r;
          const ry = Math.sin(ang) * r;
          if (j === 0) ctx.moveTo(rx, ry);
          else ctx.lineTo(rx, ry);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(b.x - ast.x, b.y - ast.y) < ast.radius + b.radius) {
            ast.hp -= b.damage;
            playHitSound();
            if (b.canFragment) fragmentBullet(b.x, b.y);
            bullets.splice(j, 1);

            if (ast.hp <= 0) {
              createExplosion(ast.x, ast.y, '#66aa77', 18);
              score += 80;
              asteroids.splice(i, 1);
              break;
            }
          }
        }

        if (Math.hypot(player.x - ast.x, player.y - ast.y) < player.radius + ast.radius - 3) {
          if (!isGodMode) {
            createExplosion(player.x, player.y, player.color, 25, true);
            state = 'GAMEOVER';
            MusicEngine.stop();
          } else {
            createExplosion(ast.x, ast.y, '#66aa77', 10, false);
            asteroids.splice(i, 1);
            continue;
          }
        }

        if (ast.y > canvas.height + 40) asteroids.splice(i, 1);
      }

      // --- PICKUPY ULEPSZEŃ ---
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.y += p.vy;
        p.rot += 0.05;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.shadowBlur = 16;
        ctx.shadowColor = '#00ffff';
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(-8, -8, 16, 16);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-4, -4, 8, 8);
        ctx.restore();

        if (Math.hypot(player.x - p.x, player.y - p.y) < player.radius + 18) {
          if (player.weaponLevel < player.maxWeaponLevel) {
            player.weaponLevel++;
            playPowerupSound(player.weaponLevel);
            targetTierNeeded = player.weaponLevel + 1;
            retryUpgradeTimer = 0;
            addFloatingText(`BROŃ: POZIOM ${player.weaponLevel}!`, player.x, player.y - 30, '#00ffcc');
          } else {
            playPowerupSound(5);
            score += 500;
            addFloatingText('+500 OVERDRIVE', player.x, player.y - 30, '#ffea00');
          }
          pickups.splice(i, 1);
          continue;
        }

        if (p.y > canvas.height + 30) {
          pickups.splice(i, 1);
          addFloatingText('UPGRADE PRZEPADŁ!', canvas.width / 2, canvas.height - 120, '#ff0055');
          retryUpgradeTimer = RETRY_DELAY;
        }
      }

      // --- RYSOWANIE GRACZA ---
      ctx.save();
      if (isGodMode) {
        ctx.strokeStyle = '#ffea00';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffea00';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius + 6 + Math.sin(now * 0.01) * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.shadowBlur = 16;
      ctx.shadowColor = isGodMode ? '#ffea00' : player.color;
      ctx.fillStyle = isGodMode ? '#ffea00' : player.color;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - player.radius - 4);
      ctx.lineTo(player.x + player.radius, player.y + player.radius);
      ctx.lineTo(player.x, player.y + player.radius * 0.45);
      ctx.lineTo(player.x - player.radius, player.y + player.radius);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ff7700';
      ctx.beginPath();
      ctx.arc(player.x, player.y + player.radius * 0.6, 4 + Math.random() * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // --- WROGOWIE ---
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.y += en.speed;
        if (en.flash > 0) en.flash--;

        if (en.shootCooldown !== 999) {
          en.shootCooldown--;
          if (en.shootCooldown <= 0 && en.y > 40 && en.y < canvas.height * 0.7) {
            if (en.type === 'cruiser') {
              fireEnemyBullet(en.x, en.y + en.radius, 0, 5.0, '#ff0055');
              en.shootCooldown = 75;
            } else if (en.type === 'titan') {
              const angle = Math.atan2(player.y - en.y, player.x - en.x);
              fireEnemyBullet(en.x, en.y + en.radius, Math.cos(angle) * 4.5, Math.sin(angle) * 4.5, '#bf00ff');
              en.shootCooldown = 90;
            }
          }
        }

        if (en.hasUpgrade) {
          ctx.save();
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 2.5;
          ctx.setLineDash([6, 4]);
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#00ffff';
          ctx.beginPath();
          ctx.arc(en.x, en.y, en.radius + 8 + Math.sin(now * 0.009) * 3, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = '#00ffff';
          ctx.font = 'bold 10px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('UPGRADE', en.x, en.y - en.radius - 12);
          ctx.restore();
        }

        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = en.color;
        ctx.fillStyle = en.flash > 0 ? '#ffffff' : en.color;
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
        ctx.fill();

        if (en.maxHp > 1) {
          const hpWidth = en.radius * 2;
          const hpX = en.x - en.radius;
          const hpY = en.y - en.radius - 6;
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(hpX, hpY, hpWidth, 4);
          ctx.fillStyle = '#00ffcc';
          ctx.fillRect(hpX, hpY, hpWidth * (en.hp / en.maxHp), 4);
        }
        ctx.restore();

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(b.x - en.x, b.y - en.y) < en.radius + b.radius) {
            en.hp -= b.damage;
            en.flash = 3;
            playHitSound();

            if (b.canFragment) fragmentBullet(b.x, b.y);
            bullets.splice(j, 1);

            if (en.hp <= 0) {
              enemiesKilled++;
              const isHeavy = en.maxHp >= 5;
              createExplosion(en.x, en.y, en.color, isHeavy ? 24 : 14, isHeavy);
              score += en.scoreVal;

              if (en.hasUpgrade) pickups.push({ x: en.x, y: en.y, vy: 1.8, rot: 0 });
              enemies.splice(i, 1);
              break;
            }
          }
        }

        if (Math.hypot(player.x - en.x, player.y - en.y) < player.radius + en.radius - 3) {
          if (!isGodMode) {
            createExplosion(player.x, player.y, player.color, 25, true);
            state = 'GAMEOVER';
            MusicEngine.stop();
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('cyber_dodge_hi', highScore);
            }
          } else {
            createExplosion(en.x, en.y, en.color, 12, false);
            enemies.splice(i, 1);
            continue;
          }
        }

        if (en.y > canvas.height + 50) {
          if (en.hasUpgrade) {
            addFloatingText('TRANSPORTER UCIEKŁ!', canvas.width / 2, canvas.height - 120, '#ff0055');
            retryUpgradeTimer = RETRY_DELAY;
          }
          enemies.splice(i, 1);
        }
      }

      // --- CZĄSTECZKI & PŁYWAJĄCE NAPISY ---
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.032;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.02;
        if (ft.alpha <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.fillStyle = ft.color;
        ctx.textAlign = 'center';
        ctx.font = 'bold 15px monospace';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      // --- HUD I WSKAŹNIKI ---
      const progress = Math.min(1, levelTimer / LEVEL_DURATION);
      const barWidth = canvas.width - 40;

      ctx.fillStyle = '#141a27';
      ctx.fillRect(20, 16, barWidth, 6);
      ctx.fillStyle = curColor;
      ctx.shadowBlur = 8;
      ctx.shadowColor = ctx.fillStyle;
      ctx.fillRect(20, 16, barWidth * progress, 6);
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(curSector.name || `SEKTOR 0${currentSectorIndex + 1}`, 20, 42);

      ctx.textAlign = 'right';
      ctx.fillText(boss ? 'WALKA Z BOSSEM!' : `FALA: ${Math.floor(progress * 100)}%`, canvas.width - 20, 42);

      ctx.textAlign = 'left';
      ctx.fillText(`SCORE: ${score}`, 20, 68);

      ctx.fillStyle = '#ffea00';
      ctx.fillText(`BROŃ: LVL ${player.weaponLevel}${player.weaponLevel === 5 ? ' (OVERDRIVE)' : ''}`, 20, 88);

      if (isGodMode) {
        ctx.fillStyle = '#ffea00';
        ctx.font = 'bold 11px monospace';
        ctx.fillText('⚡ DEV: INVINCIBLE [GOD MODE ON]', 20, 106);
      }

      if (retryUpgradeTimer > 0 && player.weaponLevel < player.maxWeaponLevel) {
        ctx.fillStyle = '#ff0055';
        ctx.font = '11px monospace';
        ctx.fillText(`RETRY TRANSPORTERA ZA: ${Math.ceil(retryUpgradeTimer)}s`, 20, isGodMode ? 122 : 106);
      }

      // --- EKRANY STANU ---
      if (state === 'WARMUP') {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = curColor;
        ctx.shadowBlur = 18;
        ctx.shadowColor = ctx.fillStyle;
        ctx.font = 'bold 24px monospace';
        ctx.fillText(curSector.name || `SEKTOR 0${currentSectorIndex + 1}`, canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillText('PRZYGOTUJ SIĘ!', canvas.width / 2, canvas.height / 2);
        ctx.shadowBlur = 0;
        ctx.font = 'bold 36px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`${Math.ceil(warmupTimer)}`, canvas.width / 2, canvas.height / 2 + 45);
        ctx.restore();
      } else if (state === 'WON') {
        ctx.save();
        ctx.fillStyle = '#00ffcc';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00ffcc';
        ctx.font = 'bold 28px monospace';
        ctx.fillText('KAMPANIA UKOŃCZONA!', canvas.width / 2, canvas.height / 2 - 40);
        ctx.shadowBlur = 0;
        ctx.font = '18px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Ukończono wszystkie sektory (${campaign.length})!`, canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#aaaaaa';
        ctx.fillText(`Zestrzelenia: ${enemiesKilled}`, canvas.width / 2, canvas.height / 2 + 25);
        ctx.fillText(`Punkty: ${score}`, canvas.width / 2, canvas.height / 2 + 48);
        ctx.fillText(`Rekord: ${highScore}`, canvas.width / 2, canvas.height / 2 + 70);
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 16px monospace';
        ctx.fillText('Dotknij ekranu, by zagrać ponownie', canvas.width / 2, canvas.height / 2 + 115);
        ctx.restore();
      } else if (state === 'GAMEOVER') {
        ctx.save();
        ctx.fillStyle = '#ff0055';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff0055';
        ctx.font = 'bold 30px monospace';
        ctx.fillText('KADŁUB ZNISZCZONY', canvas.width / 2, canvas.height / 2 - 40);
        ctx.shadowBlur = 0;
        ctx.font = '18px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Wynik: ${score}`, canvas.width / 2, canvas.height / 2);
        ctx.fillText(`Zestrzelenia: ${enemiesKilled}`, canvas.width / 2, canvas.height / 2 + 22);
        ctx.fillStyle = '#888888';
        ctx.fillText(`Rekord: ${highScore}`, canvas.width / 2, canvas.height / 2 + 46);
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 15px monospace';
        ctx.fillText('Dotknij ekranu, by spróbować znowu', canvas.width / 2, canvas.height / 2 + 92);
        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>

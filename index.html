<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Cyber Dodge: Overdrive</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      touch-action: none; 
      user-select: none;
      -webkit-user-select: none;
    }
    body { 
      background: #06080d; 
      overflow: hidden; 
      font-family: 'Courier New', Courier, monospace; 
    }
    canvas { 
      display: block; 
      width: 100vw; 
      height: 100vh; 
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- SYNTEZATOR AUDIO ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playLaserSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.06);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.06);
    }

    function playExplodeSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(190, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function playWinSound() {
      if (!audioCtx) return;
      const notes = [440, 554, 659, 880];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.12 + 0.25);
        osc.start(audioCtx.currentTime + idx * 0.12);
        osc.stop(audioCtx.currentTime + idx * 0.12 + 0.25);
      });
    }

    // --- STAN GRACZA I POZIOMU ---
    const player = {
      x: canvas.width / 2,
      y: canvas.height * 0.75,
      radius: 18,
      color: '#00ffcc'
    };

    const LEVEL_DURATION = 35; // Długość Poziomu 1 w sekundach
    let levelTimer = 0;
    let levelWon = false;
    let gameOver = false;

    let enemies = [];
    let bullets = [];
    let particles = [];
    let score = 0;
    let highScore = parseInt(localStorage.getItem('cyber_dodge_hi') || 0);
    
    let spawnTimer = 0;
    let shootTimer = 0;
    let screenShake = 0;

    // --- STEROWANIE WZGLĘDNE (RELATYWNE) ---
    // Palec przesuwa statek proporcjonalnie bez teleportowania na pozycję dotknięcia
    let isTouching = false;
    let lastTouchX = 0;
    let lastTouchY = 0;

    function onTouchStart(e) {
      e.preventDefault();
      initAudio();

      if (gameOver || levelWon) {
        resetGame();
        return;
      }

      const touch = e.touches ? e.touches[0] : e;
      isTouching = true;
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }

    function onTouchMove(e) {
      e.preventDefault();
      if (!isTouching) return;

      const touch = e.touches ? e.touches[0] : e;
      const dx = touch.clientX - lastTouchX;
      const dy = touch.clientY - lastTouchY;

      // Płynne przesunięcie statku o wektor przesunięcia palca
      player.x += dx;
      player.y += dy;

      // Granice ekranu
      player.x = Math.max(player.radius + 5, Math.min(canvas.width - player.radius - 5, player.x));
      player.y = Math.max(player.radius + 40, Math.min(canvas.height - player.radius - 20, player.y));

      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }

    function onTouchEnd(e) {
      e.preventDefault();
      isTouching = false;
    }

    // Rejestracja zdarzeń dotykowych i myszy
    window.addEventListener('touchstart', onTouchStart, { passive: false });
    window.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('touchend', onTouchEnd, { passive: false });

    window.addEventListener('mousedown', onTouchStart);
    window.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);

    function resetGame() {
      enemies = [];
      bullets = [];
      particles = [];
      score = 0;
      levelTimer = 0;
      levelWon = false;
      gameOver = false;
      player.x = canvas.width / 2;
      player.y = canvas.height * 0.75;
      isTouching = false;
    }

    function createExplosion(x, y, color) {
      screenShake = 9;
      playExplodeSound();
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1.5,
          color: color,
          alpha: 1
        });
      }
    }

    // --- GŁÓWNA PĘTLA GRY ---
    let lastTimestamp = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTimestamp) / 1000, 0.1);
      lastTimestamp = now;

      // Wstrząs ekranu
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.86;
        if (screenShake < 0.4) screenShake = 0;
      }

      // Tło z poświatą
      ctx.fillStyle = 'rgba(6, 8, 13, 0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!gameOver && !levelWon) {
        levelTimer += dt;
        spawnTimer++;
        shootTimer++;

        const waveCompleted = levelTimer >= LEVEL_DURATION;

        // Auto-strzelanie podczas dotyku
        if (isTouching && shootTimer % 8 === 0) {
          bullets.push({ x: player.x - 8, y: player.y - 18 });
          bullets.push({ x: player.x + 8, y: player.y - 18 });
          playLaserSound();
        }

        // Spawnowanie wrogów (dopóki fala się nie skończyła)
        if (!waveCompleted) {
          const spawnInterval = Math.max(16, 26 - Math.floor(levelTimer / 4));
          if (spawnTimer % spawnInterval === 0) {
            enemies.push({
              x: Math.random() * (canvas.width - 50) + 25,
              y: -30,
              radius: Math.random() * 9 + 13,
              speed: 3.5 + Math.random() * 2.2 + (levelTimer / 12),
              color: Math.random() > 0.3 ? '#ff0055' : '#ffaa00'
            });
          }
        } else if (enemies.length === 0) {
          // Fala skończona i zestrzelono/minięto wszystkich wrogów -> Wygrana!
          levelWon = true;
          playWinSound();
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('cyber_dodge_hi', highScore);
          }
        }

        // Ruch i rysowanie pocisków
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.y -= 15;

          ctx.fillStyle = '#00ffff';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#00ffff';
          ctx.fillRect(b.x - 2, b.y, 4, 14);

          if (b.y < -20) bullets.splice(i, 1);
        }

        // Rysowanie statku gracza (ostry neonowy myśliwiec)
        ctx.save();
        ctx.shadowBlur = 16;
        ctx.shadowColor = player.color;
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.radius - 4);
        ctx.lineTo(player.x + player.radius, player.y + player.radius);
        ctx.lineTo(player.x, player.y + player.radius * 0.5);
        ctx.lineTo(player.x - player.radius, player.y + player.radius);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Obsługa wrogów
        for (let i = enemies.length - 1; i >= 0; i--) {
          const en = enemies[i];
          en.y += en.speed;

          // Rysowanie wroga
          ctx.save();
          ctx.shadowBlur = 12;
          ctx.shadowColor = en.color;
          ctx.fillStyle = en.color;
          ctx.beginPath();
          ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Kolizje pocisków z wrogami
          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            const distBullet = Math.hypot(b.x - en.x, b.y - en.y);
            if (distBullet < en.radius + 6) {
              createExplosion(en.x, en.y, en.color);
              score += 100;
              enemies.splice(i, 1);
              bullets.splice(j, 1);
              break;
            }
          }

          // Kolizja wroga ze statkiem gracza
          const distPlayer = Math.hypot(player.x - en.x, player.y - en.y);
          if (distPlayer < player.radius + en.radius - 4) {
            createExplosion(player.x, player.y, player.color);
            gameOver = true;
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('cyber_dodge_hi', highScore);
            }
          }

          if (en.y > canvas.height + 40) {
            enemies.splice(i, 1);
          }
        }

        // --- HUD / INTERFEJS ---
        // Pasek postępu poziomu na górze
        const progress = Math.min(1, levelTimer / LEVEL_DURATION);
        const barWidth = canvas.width - 40;
        
        ctx.fillStyle = '#1a2233';
        ctx.fillRect(20, 15, barWidth, 6);
        ctx.fillStyle = '#00ffcc';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00ffcc';
        ctx.fillRect(20, 15, barWidth * progress, 6);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px monospace';
        ctx.fillText(`POZIOM 1`, 20, 42);
        ctx.textAlign = 'right';
        ctx.fillText(`FALA: ${Math.floor(progress * 100)}%`, canvas.width - 20, 42);

        ctx.textAlign = 'left';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(`SCORE: ${score}`, 20, 68);

      } else if (levelWon) {
        // --- EKRAN WYGRANEJ ---
        ctx.fillStyle = '#00ffcc';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00ffcc';
        ctx.font = 'bold 28px monospace';
        ctx.fillText('SEKTOR CZYSTY!', canvas.width / 2, canvas.height / 2 - 40);

        ctx.shadowBlur = 0;
        ctx.font = '18px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Poziom 1 ukończony!`, canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#aaaaaa';
        ctx.fillText(`Zdobyte punkty: ${score}`, canvas.width / 2, canvas.height / 2 + 30);
        ctx.fillText(`Rekord: ${highScore}`, canvas.width / 2, canvas.height / 2 + 55);

        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 16px monospace';
        ctx.fillText('Dotknij ekranu, by zagrać ponownie', canvas.width / 2, canvas.height / 2 + 105);
        ctx.textAlign = 'left';

      } else if (gameOver) {
        // --- EKRAN GAME OVER ---
        ctx.fillStyle = '#ff0055';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff0055';
        ctx.font = 'bold 30px monospace';
        ctx.fillText('KADŁUB ZNISZCZONY', canvas.width / 2, canvas.height / 2 - 40);

        ctx.shadowBlur = 0;
        ctx.font = '18px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Wynik: ${score}`, canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#888888';
        ctx.fillText(`Rekord: ${highScore}`, canvas.width / 2, canvas.height / 2 + 25);

        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 15px monospace';
        ctx.fillText('Dotknij ekranu, by spróbować znowu', canvas.width / 2, canvas.height / 2 + 75);
        ctx.textAlign = 'left';
      }

      // Cząsteczki wybuchów
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.035;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>

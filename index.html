<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Cyber Dodge: Overdrive</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      touch-action: none; 
      user-select: none;
      -webkit-user-select: none;
    }
    body { 
      background: #05070c; 
      overflow: hidden; 
      font-family: 'Courier New', Courier, monospace; 
    }
    canvas { 
      display: block; 
      width: 100vw; 
      height: 100vh; 
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- SYNTEZATOR AUDIO ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playLaserSound(pitchMod = 1) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800 * pitchMod, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 0.05);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playHitSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playExplodeSound(heavy = false) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sawtooth';
      const startFreq = heavy ? 140 : 210;
      const duration = heavy ? 0.28 : 0.18;
      osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(heavy ? 0.35 : 0.22, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playPowerupSound() {
      if (!audioCtx) return;
      const notes = [523, 659, 783, 1046];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.06);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime + idx * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.06 + 0.12);
        osc.start(audioCtx.currentTime + idx * 0.06);
        osc.stop(audioCtx.currentTime + idx * 0.06 + 0.12);
      });
    }

    function playWinSound() {
      if (!audioCtx) return;
      const notes = [440, 554, 659, 880, 1108];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.11);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime + idx * 0.11);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.11 + 0.28);
        osc.start(audioCtx.currentTime + idx * 0.11);
        osc.stop(audioCtx.currentTime + idx * 0.11 + 0.28);
      });
    }

    // --- STAN GRACZA I POZIOMU ---
    const player = {
      x: canvas.width / 2,
      y: canvas.height * 0.78,
      radius: 17,
      color: '#00ffcc',
      weaponLevel: 1, // Poziomy broni: 1 do 5
      maxWeaponLevel: 5
    };

    const LEVEL_DURATION = 38; // Czas właściwej fali w sekundach
    const WARMUP_DURATION = 2.5; // Czas rozgrzewki przed falą

    let state = 'WARMUP'; // 'WARMUP', 'PLAYING', 'WON', 'GAMEOVER'
    let warmupTimer = WARMUP_DURATION;
    let levelTimer = 0;

    let enemies = [];
    let bullets = [];
    let particles = [];
    let pickups = [];
    let floatingTexts = [];

    let score = 0;
    let highScore = parseInt(localStorage.getItem('cyber_dodge_hi') || 0);

    let spawnTimer = 0;
    let shootTimer = 0;
    let screenShake = 0;

    // --- STEROWANIE WZGLĘDNE (RELATYWNE) ---
    let isTouching = false;
    let lastTouchX = 0;
    let lastTouchY = 0;

    function onTouchStart(e) {
      e.preventDefault();
      initAudio();

      if (state === 'WON' || state === 'GAMEOVER') {
        resetGame();
        return;
      }

      const touch = e.touches ? e.touches[0] : e;
      isTouching = true;
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }

    function onTouchMove(e) {
      e.preventDefault();
      if (!isTouching) return;

      const touch = e.touches ? e.touches[0] : e;
      const dx = touch.clientX - lastTouchX;
      const dy = touch.clientY - lastTouchY;

      player.x += dx;
      player.y += dy;

      player.x = Math.max(player.radius + 6, Math.min(canvas.width - player.radius - 6, player.x));
      player.y = Math.max(player.radius + 50, Math.min(canvas.height - player.radius - 20, player.y));

      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }

    function onTouchEnd(e) {
      e.preventDefault();
      isTouching = false;
    }

    window.addEventListener('touchstart', onTouchStart, { passive: false });
    window.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('touchend', onTouchEnd, { passive: false });

    window.addEventListener('mousedown', onTouchStart);
    window.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);

    function resetGame() {
      enemies = [];
      bullets = [];
      particles = [];
      pickups = [];
      floatingTexts = [];
      score = 0;
      levelTimer = 0;
      warmupTimer = WARMUP_DURATION;
      state = 'WARMUP';
      player.weaponLevel = 1;
      player.x = canvas.width / 2;
      player.y = canvas.height * 0.78;
      isTouching = false;
    }

    // --- SPIS BRONI I STRZELANIE ---
    function shootWeapons() {
      const lvl = player.weaponLevel;
      const px = player.x;
      const py = player.y - player.radius;

      if (lvl === 1) {
        // Pojedynczy centralny laser
        bullets.push({ x: px, y: py, vx: 0, vy: -15, damage: 1, color: '#00ffff', radius: 3, canFragment: false });
        playLaserSound(1.0);
      } else if (lvl === 2) {
        // Podwójny równoległy laser
        bullets.push({ x: px - 8, y: py, vx: 0, vy: -15, damage: 1, color: '#00ffff', radius: 3, canFragment: false });
        bullets.push({ x: px + 8, y: py, vx: 0, vy: -15, damage: 1, color: '#00ffff', radius: 3, canFragment: false });
        playLaserSound(1.1);
      } else if (lvl === 3) {
        // Potrójny wachlarz
        bullets.push({ x: px, y: py, vx: 0, vy: -15, damage: 1, color: '#00ffff', radius: 3.5, canFragment: false });
        bullets.push({ x: px - 9, y: py, vx: -2.8, vy: -14.5, damage: 1, color: '#33ffaa', radius: 3, canFragment: false });
        bullets.push({ x: px + 9, y: py, vx: 2.8, vy: -14.5, damage: 1, color: '#33ffaa', radius: 3, canFragment: false });
        playLaserSound(1.2);
      } else if (lvl === 4) {
        // Fragmentująca plazma (rozpada się po trafieniu!)
        bullets.push({ x: px, y: py, vx: 0, vy: -15, damage: 1.5, color: '#ffea00', radius: 4.5, canFragment: true });
        bullets.push({ x: px - 11, y: py, vx: -3.2, vy: -14, damage: 1, color: '#ff9900', radius: 3.5, canFragment: false });
        bullets.push({ x: px + 11, y: py, vx: 3.2, vy: -14, damage: 1, color: '#ff9900', radius: 3.5, canFragment: false });
        playLaserSound(1.3);
      } else if (lvl >= 5) {
        // Overdrive: 5-strzałowy rozrzut z fragmentacją odłamkową
        bullets.push({ x: px, y: py, vx: 0, vy: -16, damage: 2, color: '#ff00ff', radius: 5, canFragment: true });
        bullets.push({ x: px - 7, y: py, vx: -2.2, vy: -15.5, damage: 1.2, color: '#00ffff', radius: 3.5, canFragment: true });
        bullets.push({ x: px + 7, y: py, vx: 2.2, vy: -15.5, damage: 1.2, color: '#00ffff', radius: 3.5, canFragment: true });
        bullets.push({ x: px - 14, y: py, vx: -5.0, vy: -13.5, damage: 1, color: '#ffea00', radius: 3, canFragment: false });
        bullets.push({ x: px + 14, y: py, vx: 5.0, vy: -13.5, damage: 1, color: '#ffea00', radius: 3, canFragment: false });
        playLaserSound(1.45);
      }
    }

    // Fragmentacja pocisku (wybuch odłamkowy w 4 strony)
    function fragmentBullet(x, y) {
      const angles = [Math.PI * 0.25, Math.PI * 0.75, Math.PI * 1.25, Math.PI * 1.75];
      for (const a of angles) {
        bullets.push({
          x: x,
          y: y,
          vx: Math.cos(a) * 9,
          vy: Math.sin(a) * 9,
          damage: 1,
          color: '#ffea00',
          radius: 2.5,
          canFragment: false,
          isShard: true,
          life: 25
        });
      }
    }

    // --- TYPY WROGÓW ---
    function spawnEnemy() {
      const rand = Math.random();
      let enemy = {};

      if (rand < 0.55) {
        // Szybki dron (1 HP)
        enemy = {
          x: Math.random() * (canvas.width - 40) + 20,
          y: -25,
          radius: 12,
          speed: 4.8 + Math.random() * 1.2 + (levelTimer / 25),
          hp: 1,
          maxHp: 1,
          color: '#ffaa00',
          type: 'scout',
          scoreVal: 50,
          flash: 0
        };
      } else if (rand < 0.88) {
        // Krążownik bojowy (3 HP)
        enemy = {
          x: Math.random() * (canvas.width - 50) + 25,
          y: -30,
          radius: 18,
          speed: 3.3 + Math.random() * 0.8 + (levelTimer / 30),
          hp: 3,
          maxHp: 3,
          color: '#ff0055',
          type: 'cruiser',
          scoreVal: 120,
          flash: 0
        };
      } else {
        // Ciężki niszczyciel (7 HP)
        enemy = {
          x: Math.random() * (canvas.width - 60) + 30,
          y: -40,
          radius: 26,
          speed: 2.2 + Math.random() * 0.5,
          hp: 7,
          maxHp: 7,
          color: '#bf00ff',
          type: 'titan',
          scoreVal: 300,
          flash: 0
        };
      }
      enemies.push(enemy);
    }

    function createExplosion(x, y, color, count = 15, heavy = false) {
      screenShake = heavy ? 14 : 7;
      playExplodeSound(heavy);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * (heavy ? 7 : 5) + 1.5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1.5,
          color: color,
          alpha: 1
        });
      }
    }

    function addFloatingText(text, x, y, color) {
      floatingTexts.push({ text, x, y, color, alpha: 1, vy: -1.2 });
    }

    // --- GŁÓWNA PĘTLA GRY ---
    let lastTimestamp = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTimestamp) / 1000, 0.1);
      lastTimestamp = now;

      // Screen Shake
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.86;
        if (screenShake < 0.4) screenShake = 0;
      }

      // Tło z lekkim ogonem (motion blur)
      ctx.fillStyle = 'rgba(5, 7, 12, 0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // --- MASZYNA STANÓW ---
      if (state === 'WARMUP') {
        warmupTimer -= dt;
        if (warmupTimer <= 0) {
          state = 'PLAYING';
          addFloatingText('FALA ROZPOCZĘTA!', canvas.width / 2, canvas.height / 2, '#00ffcc');
        }
      } else if (state === 'PLAYING') {
        levelTimer += dt;
        spawnTimer++;
        shootTimer++;

        const waveCompleted = levelTimer >= LEVEL_DURATION;

        // Auto-strzelanie podczas dotyku
        const shootRate = player.weaponLevel >= 4 ? 7 : 8;
        if (isTouching && shootTimer % shootRate === 0) {
          shootWeapons();
        }

        // Spawnowanie wrogów
        if (!waveCompleted) {
          const spawnInterval = Math.max(14, 25 - Math.floor(levelTimer / 3.5));
          if (spawnTimer % spawnInterval === 0) {
            spawnEnemy();
          }
        } else if (enemies.length === 0) {
          // Wygrana poziomu!
          state = 'WON';
          playWinSound();
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('cyber_dodge_hi', highScore);
          }
        }
      }

      // --- LOGIKA I RYSOWANIE POCISKÓW ---
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx || 0;
        b.y += b.vy;

        if (b.isShard) {
          b.life--;
          if (b.life <= 0) {
            bullets.splice(i, 1);
            continue;
          }
        }

        ctx.save();
        ctx.shadowBlur = 9;
        ctx.shadowColor = b.color;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (b.y < -30 || b.y > canvas.height + 30 || b.x < -30 || b.x > canvas.width + 30) {
          bullets.splice(i, 1);
        }
      }

      // --- LOGIKA I RYSOWANIE PICKUPÓW ---
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.y += p.vy;
        p.rot += 0.05;

        // Rysowanie pulsującego błękitno-złotego kryształu
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#00ffff';
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(-7, -7, 14, 14);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-4, -4, 8, 8);
        ctx.restore();

        // Kolizja z graczem
        const dist = Math.hypot(player.x - p.x, player.y - p.y);
        if (dist < player.radius + 15) {
          playPowerupSound();
          if (player.weaponLevel < player.maxWeaponLevel) {
            player.weaponLevel++;
            addFloatingText(`WEAPON LVL ${player.weaponLevel}!`, player.x, player.y - 30, '#00ffcc');
          } else {
            score += 500;
            addFloatingText('+500 OVERDRIVE', player.x, player.y - 30, '#ffea00');
          }
          pickups.splice(i, 1);
          continue;
        }

        if (p.y > canvas.height + 30) pickups.splice(i, 1);
      }

      // --- RYSOWANIE STATKU GRACZA ---
      ctx.save();
      ctx.shadowBlur = 16;
      ctx.shadowColor = player.color;
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - player.radius - 4);
      ctx.lineTo(player.x + player.radius, player.y + player.radius);
      ctx.lineTo(player.x, player.y + player.radius * 0.45);
      ctx.lineTo(player.x - player.radius, player.y + player.radius);
      ctx.closePath();
      ctx.fill();

      // Silnik / odrzutowiec
      ctx.fillStyle = '#ff7700';
      ctx.beginPath();
      ctx.arc(player.x, player.y + player.radius * 0.6, 4 + Math.random() * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // --- LOGIKA I RYSOWANIE WROGÓW ---
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.y += en.speed;
        if (en.flash > 0) en.flash--;

        // Rysowanie wroga (lub biały błysk hit-flash)
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = en.color;
        ctx.fillStyle = en.flash > 0 ? '#ffffff' : en.color;
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
        ctx.fill();

        // Mini pasek HP dla twardszych wrogów (> 1 HP)
        if (en.maxHp > 1) {
          const hpWidth = en.radius * 2;
          const hpHeight = 4;
          const hpX = en.x - en.radius;
          const hpY = en.y - en.radius - 8;

          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(hpX, hpY, hpWidth, hpHeight);
          ctx.fillStyle = '#00ffcc';
          ctx.fillRect(hpX, hpY, hpWidth * (en.hp / en.maxHp), hpHeight);
        }
        ctx.restore();

        // Kolizje pocisków z wrogami
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const distBullet = Math.hypot(b.x - en.x, b.y - en.y);

          if (distBullet < en.radius + b.radius) {
            en.hp -= b.damage;
            en.flash = 3;
            playHitSound();

            // Jeśli pocisk ma fragmentację -> rozpad na odłamki
            if (b.canFragment) {
              fragmentBullet(b.x, b.y);
            }

            bullets.splice(j, 1);

            // Wróg zniszczony!
            if (en.hp <= 0) {
              const isHeavy = en.maxHp >= 6;
              createExplosion(en.x, en.y, en.color, isHeavy ? 28 : 14, isHeavy);
              score += en.scoreVal;

              // Szansa na zrzut pickupu ulepszenia (25% z małych, 50% ze średnich, 100% z dużych)
              const dropChance = en.maxHp >= 6 ? 1.0 : (en.maxHp >= 3 ? 0.45 : 0.18);
              if (Math.random() < dropChance) {
                pickups.push({ x: en.x, y: en.y, vy: 1.8, rot: 0 });
              }

              enemies.splice(i, 1);
              break;
            }
          }
        }

        // Kolizja wroga ze statkiem gracza
        const distPlayer = Math.hypot(player.x - en.x, player.y - en.y);
        if (distPlayer < player.radius + en.radius - 3) {
          createExplosion(player.x, player.y, player.color, 25, true);
          state = 'GAMEOVER';
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('cyber_dodge_hi', highScore);
          }
        }

        if (en.y > canvas.height + 50) {
          enemies.splice(i, 1);
        }
      }

      // --- CZYSTE CZĄSTECZKI WYBUCHÓW ---
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.032;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // --- PŁYWAJĄCE NAPISY (+UPGRADE itp.) ---
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.02;

        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.fillStyle = ft.color;
        ctx.textAlign = 'center';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      // --- HUD I INTERFEJS ---
      const progress = Math.min(1, levelTimer / LEVEL_DURATION);
      const barWidth = canvas.width - 40;

      // Górny pasek fali
      ctx.fillStyle = '#141a27';
      ctx.fillRect(20, 16, barWidth, 6);
      ctx.fillStyle = '#00ffcc';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00ffcc';
      ctx.fillRect(20, 16, barWidth * progress, 6);
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`POZIOM 1`, 20, 42);

      ctx.textAlign = 'right';
      ctx.fillText(`FALA: ${Math.floor(progress * 100)}%`, canvas.width - 20, 42);

      // Wynik i Poziom Broni
      ctx.textAlign = 'left';
      ctx.fillText(`SCORE: ${score}`, 20, 68);

      // Wskaźnik poziomu broni
      ctx.fillStyle = '#ffea00';
      ctx.fillText(`BROŃ: LVL ${player.weaponLevel}${player.weaponLevel === 5 ? ' (MAX)' : ''}`, 20, 90);

      // --- EKRANY SPECJALNE ---
      if (state === 'WARMUP') {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#00ffcc';
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#00ffcc';
        ctx.font = 'bold 26px monospace';
        ctx.fillText('PRZYGOTUJ SIĘ!', canvas.width / 2, canvas.height / 2 - 25);

        ctx.shadowBlur = 0;
        ctx.font = 'bold 36px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`${Math.ceil(warmupTimer)}`, canvas.width / 2, canvas.height / 2 + 25);
        ctx.restore();
      } else if (state === 'WON') {
        ctx.save();
        ctx.fillStyle = '#00ffcc';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00ffcc';
        ctx.font = 'bold 28px monospace';
        ctx.fillText('SEKTOR CZYSTY!', canvas.width / 2, canvas.height / 2 - 40);

        ctx.shadowBlur = 0;
        ctx.font = '18px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Poziom 1 ukończony!`, canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#aaaaaa';
        ctx.fillText(`Zdobyte punkty: ${score}`, canvas.width / 2, canvas.height / 2 + 30);
        ctx.fillText(`Rekord: ${highScore}`, canvas.width / 2, canvas.height / 2 + 55);

        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 16px monospace';
        ctx.fillText('Dotknij ekranu, by zagrać ponownie', canvas.width / 2, canvas.height / 2 + 105);
        ctx.restore();
      } else if (state === 'GAMEOVER') {
        ctx.save();
        ctx.fillStyle = '#ff0055';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff0055';
        ctx.font = 'bold 30px monospace';
        ctx.fillText('KADŁUB ZNISZCZONY', canvas.width / 2, canvas.height / 2 - 40);

        ctx.shadowBlur = 0;
        ctx.font = '18px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Wynik: ${score}`, canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#888888';
        ctx.fillText(`Rekord: ${highScore}`, canvas.width / 2, canvas.height / 2 + 25);

        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 15px monospace';
        ctx.fillText('Dotknij ekranu, by spróbować znowu', canvas.width / 2, canvas.height / 2 + 75);
        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>

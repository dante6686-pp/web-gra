<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Cyber Dodge: Overdrive</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      touch-action: none; 
      user-select: none;
      -webkit-user-select: none;
    }
    body { 
      background: #05070c; 
      overflow: hidden; 
      font-family: 'Courier New', Courier, monospace; 
    }
    canvas { 
      display: block; 
      width: 100vw; 
      height: 100vh; 
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Syntezator dźwięków Web Audio API
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playLaserSound(pitchMod = 1) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(820 * pitchMod, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 0.05);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playHitSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(340, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playExplodeSound(heavy = false) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sawtooth';
      const startFreq = heavy ? 140 : 220;
      const duration = heavy ? 0.28 : 0.18;
      osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(heavy ? 0.35 : 0.22, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playPowerupSound() {
      if (!audioCtx) return;
      const notes = [523, 659, 783, 1046];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.06);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime + idx * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.06 + 0.12);
        osc.start(audioCtx.currentTime + idx * 0.06);
        osc.stop(audioCtx.currentTime + idx * 0.06 + 0.12);
      });
    }

    function playAlertSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.16);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.16);
    }

    function playWinSound() {
      if (!audioCtx) return;
      const notes = [440, 554, 659, 880, 1108];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.11);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime + idx * 0.11);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.11 + 0.28);
        osc.start(audioCtx.currentTime + idx * 0.11);
        osc.stop(audioCtx.currentTime + idx * 0.11 + 0.28);
      });
    }

    const player = {
      x: canvas.width / 2,
      y: canvas.height * 0.78,
      radius: 17,
      color: '#00ffcc',
      weaponLevel: 1,
      maxWeaponLevel: 5
    };

    const LEVEL_DURATION = 45; // Czas fali: 45 sekund
    const WARMUP_DURATION = 2.5;

    // Równe kamienie milowe fali:
    // Poziom 2: 20% fali (9s)
    // Poziom 3: 40% fali (18s)
    // Poziom 4: 60% fali (27s)
    // Poziom 5: 80% fali (36s) -> 80%-100% to finałowy Overdrive
    const UPGRADE_MILESTONES = [
      { targetTier: 2, triggerProgress: 0.20, triggered: false },
      { targetTier: 3, triggerProgress: 0.40, triggered: false },
      { targetTier: 4, triggerProgress: 0.60, triggered: false },
      { targetTier: 5, triggerProgress: 0.80, triggered: false }
    ];

    let state = 'WARMUP';
    let warmupTimer = WARMUP_DURATION;
    let levelTimer = 0;
    let enemiesKilled = 0;

    let targetTierNeeded = 2; // Następny poziom, o który walczymy
    let retryUpgradeTimer = 0; // Czas do ponowienia po ucieczce transportera lub przepadnięciu kryształu
    const RETRY_DELAY = 5.0;   // 5 sekund na ponowny spawn w razie straty

    let enemies = [];
    let bullets = [];
    let particles = [];
    let pickups = [];
    let floatingTexts = [];

    let score = 0;
    let highScore = parseInt(localStorage.getItem('cyber_dodge_hi') || 0);

    let spawnTimer = 0;
    let shootTimer = 0;
    let screenShake = 0;

    let isTouching = false;
    let lastTouchX = 0;
    let lastTouchY = 0;

    function onTouchStart(e) {
      e.preventDefault();
      initAudio();

      if (state === 'WON' || state === 'GAMEOVER') {
        resetGame();
        return;
      }

      const touch = e.touches ? e.touches[0] : e;
      isTouching = true;
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }

    function onTouchMove(e) {
      e.preventDefault();
      if (!isTouching) return;

      const touch = e.touches ? e.touches[0] : e;
      const dx = touch.clientX - lastTouchX;
      const dy = touch.clientY - lastTouchY;

      player.x += dx;
      player.y += dy;

      player.x = Math.max(player.radius + 6, Math.min(canvas.width - player.radius - 6, player.x));
      player.y = Math.max(player.radius + 50, Math.min(canvas.height - player.radius - 20, player.y));

      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }

    function onTouchEnd(e) {
      e.preventDefault();
      isTouching = false;
    }

    window.addEventListener('touchstart', onTouchStart, { passive: false });
    window.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('touchend', onTouchEnd, { passive: false });

    window.addEventListener('mousedown', onTouchStart);
    window.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);

    function resetGame() {
      enemies = [];
      bullets = [];
      particles = [];
      pickups = [];
      floatingTexts = [];
      score = 0;
      levelTimer = 0;
      enemiesKilled = 0;
      warmupTimer = WARMUP_DURATION;
      state = 'WARMUP';
      player.weaponLevel = 1;
      targetTierNeeded = 2;
      retryUpgradeTimer = 0;

      UPGRADE_MILESTONES.forEach(m => m.triggered = false);

      player.x = canvas.width / 2;
      player.y = canvas.height * 0.78;
      isTouching = false;
    }

    function shootWeapons() {
      const lvl = player.weaponLevel;
      const px = player.x;
      const py = player.y - player.radius;

      if (lvl === 1) {
        bullets.push({ x: px, y: py, vx: 0, vy: -15, damage: 1, color: '#00ffff', radius: 3, canFragment: false });
        playLaserSound(1.0);
      } else if (lvl === 2) {
        bullets.push({ x: px - 8, y: py, vx: 0, vy: -15, damage: 1, color: '#00ffff', radius: 3, canFragment: false });
        bullets.push({ x: px + 8, y: py, vx: 0, vy: -15, damage: 1, color: '#00ffff', radius: 3, canFragment: false });
        playLaserSound(1.1);
      } else if (lvl === 3) {
        bullets.push({ x: px, y: py, vx: 0, vy: -15, damage: 1, color: '#00ffff', radius: 3.5, canFragment: false });
        bullets.push({ x: px - 9, y: py, vx: -2.8, vy: -14.5, damage: 1, color: '#33ffaa', radius: 3, canFragment: false });
        bullets.push({ x: px + 9, y: py, vx: 2.8, vy: -14.5, damage: 1, color: '#33ffaa', radius: 3, canFragment: false });
        playLaserSound(1.2);
      } else if (lvl === 4) {
        bullets.push({ x: px, y: py, vx: 0, vy: -15, damage: 1.5, color: '#ffea00', radius: 4.5, canFragment: true });
        bullets.push({ x: px - 11, y: py, vx: -3.2, vy: -14, damage: 1, color: '#ff9900', radius: 3.5, canFragment: false });
        bullets.push({ x: px + 11, y: py, vx: 3.2, vy: -14, damage: 1, color: '#ff9900', radius: 3.5, canFragment: false });
        playLaserSound(1.3);
      } else if (lvl >= 5) {
        bullets.push({ x: px, y: py, vx: 0, vy: -16, damage: 2, color: '#ff00ff', radius: 5, canFragment: true });
        bullets.push({ x: px - 7, y: py, vx: -2.2, vy: -15.5, damage: 1.2, color: '#00ffff', radius: 3.5, canFragment: true });
        bullets.push({ x: px + 7, y: py, vx: 2.2, vy: -15.5, damage: 1.2, color: '#00ffff', radius: 3.5, canFragment: true });
        bullets.push({ x: px - 14, y: py, vx: -5.0, vy: -13.5, damage: 1, color: '#ffea00', radius: 3, canFragment: false });
        bullets.push({ x: px + 14, y: py, vx: 5.0, vy: -13.5, damage: 1, color: '#ffea00', radius: 3, canFragment: false });
        playLaserSound(1.45);
      }
    }

    function fragmentBullet(x, y) {
      const angles = [Math.PI * 0.25, Math.PI * 0.75, Math.PI * 1.25, Math.PI * 1.75];
      for (const a of angles) {
        bullets.push({
          x: x,
          y: y,
          vx: Math.cos(a) * 9,
          vy: Math.sin(a) * 9,
          damage: 1,
          color: '#ffea00',
          radius: 2.5,
          canFragment: false,
          isShard: true,
          life: 25
        });
      }
    }

    function spawnUpgradeCarrier() {
      playAlertSound();
      addFloatingText('! TRANSPORTER ZASOBÓW !', canvas.width / 2, 70, '#00ffff');

      const carrier = {
        x: Math.random() * (canvas.width - 60) + 30,
        y: -35,
        radius: 22,
        speed: 2.4, // Wolniejszy, żeby gracz miał czas go ustrzelić
        hp: 5,
        maxHp: 5,
        color: '#00e5ff',
        type: 'carrier',
        scoreVal: 250,
        flash: 0,
        hasUpgrade: true
      };

      enemies.push(carrier);
    }

    function spawnRegularEnemy() {
      const rand = Math.random();
      let enemy = {};

      if (rand < 0.60) {
        // Dron (1 HP)
        enemy = {
          x: Math.random() * (canvas.width - 40) + 20,
          y: -25,
          radius: 12,
          speed: 4.8 + Math.random() * 1.2 + (levelTimer / 30),
          hp: 1,
          maxHp: 1,
          color: '#ffaa00',
          type: 'scout',
          scoreVal: 50,
          flash: 0,
          hasUpgrade: false
        };
      } else if (rand < 0.88) {
        // Krążownik (3 HP)
        enemy = {
          x: Math.random() * (canvas.width - 50) + 25,
          y: -30,
          radius: 18,
          speed: 3.3 + Math.random() * 0.8 + (levelTimer / 35),
          hp: 3,
          maxHp: 3,
          color: '#ff0055',
          type: 'cruiser',
          scoreVal: 120,
          flash: 0,
          hasUpgrade: false
        };
      } else {
        // Niszczyciel (7 HP)
        enemy = {
          x: Math.random() * (canvas.width - 60) + 30,
          y: -40,
          radius: 26,
          speed: 2.2 + Math.random() * 0.5,
          hp: 7,
          maxHp: 7,
          color: '#bf00ff',
          type: 'titan',
          scoreVal: 300,
          flash: 0,
          hasUpgrade: false
        };
      }

      enemies.push(enemy);
    }

    function createExplosion(x, y, color, count = 15, heavy = false) {
      screenShake = heavy ? 14 : 7;
      playExplodeSound(heavy);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * (heavy ? 7 : 5) + 1.5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1.5,
          color: color,
          alpha: 1
        });
      }
    }

    function addFloatingText(text, x, y, color) {
      floatingTexts.push({ text, x, y, color, alpha: 1, vy: -1.2 });
    }

    let lastTimestamp = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTimestamp) / 1000, 0.1);
      lastTimestamp = now;

      // Screen Shake
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.86;
        if (screenShake < 0.4) screenShake = 0;
      }

      // Tło z motion blur
      ctx.fillStyle = 'rgba(5, 7, 12, 0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // --- LOGIKA STANÓW ---
      if (state === 'WARMUP') {
        warmupTimer -= dt;
        if (warmupTimer <= 0) {
          state = 'PLAYING';
          addFloatingText('FALA ROZPOCZĘTA!', canvas.width / 2, canvas.height / 2, '#00ffcc');
        }
      } else if (state === 'PLAYING') {
        levelTimer += dt;
        spawnTimer++;
        shootTimer++;

        const waveProgress = Math.min(1, levelTimer / LEVEL_DURATION);
        const waveCompleted = levelTimer >= LEVEL_DURATION;

        // Auto-strzelanie
        const shootRate = player.weaponLevel >= 4 ? 7 : 8;
        if (isTouching && shootTimer % shootRate === 0) {
          shootWeapons();
        }

        // Sprawdzamy czy transporter lub kryształ ulepszenia jest aktualnie w grze
        const hasCarrierOnScreen = enemies.some(e => e.hasUpgrade);
        const hasPickupOnScreen = pickups.length > 0;

        // --- HARMONOGRAM UPGRADE'ÓW ---
        if (!waveCompleted && player.weaponLevel < player.maxWeaponLevel) {
          // 1. Sprawdzamy czy nadszedł czas na kolejny kamień milowy (20%, 40%, 60%, 80%)
          const nextMilestone = UPGRADE_MILESTONES.find(m => m.targetTier === targetTierNeeded);
          if (nextMilestone && !nextMilestone.triggered && waveProgress >= nextMilestone.triggerProgress) {
            nextMilestone.triggered = true;
            if (!hasCarrierOnScreen && !hasPickupOnScreen) {
              spawnUpgradeCarrier();
            }
          }

          // 2. Obsługa ponowienia (Retry) jeśli gracz przegapił ulepszenie
          if (retryUpgradeTimer > 0) {
            retryUpgradeTimer -= dt;
            if (retryUpgradeTimer <= 0 && !hasCarrierOnScreen && !hasPickupOnScreen) {
              addFloatingText('NOWY TRANSPORTER!', canvas.width / 2, 90, '#ffea00');
              spawnUpgradeCarrier();
            }
          }
        }

        // Spawnowanie standardowych wrogów
        if (!waveCompleted) {
          const spawnInterval = Math.max(14, 25 - Math.floor(levelTimer / 3.5));
          if (spawnTimer % spawnInterval === 0) {
            spawnRegularEnemy();
          }
        } else if (enemies.length === 0) {
          state = 'WON';
          playWinSound();
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('cyber_dodge_hi', highScore);
          }
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx || 0;
        b.y += b.vy;

        if (b.isShard) {
          b.life--;
          if (b.life <= 0) {
            bullets.splice(i, 1);
            continue;
          }
        }

        ctx.save();
        ctx.shadowBlur = 9;
        ctx.shadowColor = b.color;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (b.y < -30 || b.y > canvas.height + 30 || b.x < -30 || b.x > canvas.width + 30) {
          bullets.splice(i, 1);
        }
      }

      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.y += p.vy;
        p.rot += 0.05;

        // Pulsujący kryształ
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.shadowBlur = 16;
        ctx.shadowColor = '#00ffff';
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(-8, -8, 16, 16);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-4, -4, 8, 8);
        ctx.restore();

        // Kolizja z graczem
        const dist = Math.hypot(player.x - p.x, player.y - p.y);
        if (dist < player.radius + 18) {
          playPowerupSound();
          if (player.weaponLevel < player.maxWeaponLevel) {
            player.weaponLevel++;
            targetTierNeeded = player.weaponLevel + 1;
            retryUpgradeTimer = 0; // Ulepszenie zdobyte, kasujemy timer retry
            addFloatingText(`BROŃ: POZIOM ${player.weaponLevel}!`, player.x, player.y - 30, '#00ffcc');
          } else {
            score += 500;
            addFloatingText('+500 OVERDRIVE', player.x, player.y - 30, '#ffea00');
          }
          pickups.splice(i, 1);
          continue;
        }

        // Gracz NIE ZŁAPAŁ ulepszenia – wypadło za dolną krawędź ekranu!
        if (p.y > canvas.height + 30) {
          pickups.splice(i, 1);
          addFloatingText('UPGRADE PRZEPADŁ!', canvas.width / 2, canvas.height - 120, '#ff0055');
          // Włączamy szybki retry
          retryUpgradeTimer = RETRY_DELAY;
        }
      }

      ctx.save();
      ctx.shadowBlur = 16;
      ctx.shadowColor = player.color;
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - player.radius - 4);
      ctx.lineTo(player.x + player.radius, player.y + player.radius);
      ctx.lineTo(player.x, player.y + player.radius * 0.45);
      ctx.lineTo(player.x - player.radius, player.y + player.radius);
      ctx.closePath();
      ctx.fill();

      // Silnik odrzutowy
      ctx.fillStyle = '#ff7700';
      ctx.beginPath();
      ctx.arc(player.x, player.y + player.radius * 0.6, 4 + Math.random() * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.y += en.speed;
        if (en.flash > 0) en.flash--;

        // Jeśli to transporter ulepszenia – rysujemy specjalny pulsujący pierścień i napis
        if (en.hasUpgrade) {
          ctx.save();
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 2.5;
          ctx.setLineDash([6, 4]);
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#00ffff';
          ctx.beginPath();
          ctx.arc(en.x, en.y, en.radius + 8 + Math.sin(now * 0.009) * 3, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = '#00ffff';
          ctx.font = 'bold 10px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('UPGRADE', en.x, en.y - en.radius - 12);
          ctx.restore();
        }

        // Rysowanie wroga
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = en.color;
        ctx.fillStyle = en.flash > 0 ? '#ffffff' : en.color;
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
        ctx.fill();

        // Mini pasek HP (> 1 HP)
        if (en.maxHp > 1) {
          const hpWidth = en.radius * 2;
          const hpHeight = 4;
          const hpX = en.x - en.radius;
          const hpY = en.y - en.radius - 6;

          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(hpX, hpY, hpWidth, hpHeight);
          ctx.fillStyle = '#00ffcc';
          ctx.fillRect(hpX, hpY, hpWidth * (en.hp / en.maxHp), hpHeight);
        }
        ctx.restore();

        // Kolizje pocisków z wrogami
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const distBullet = Math.hypot(b.x - en.x, b.y - en.y);

          if (distBullet < en.radius + b.radius) {
            en.hp -= b.damage;
            en.flash = 3;
            playHitSound();

            if (b.canFragment) {
              fragmentBullet(b.x, b.y);
            }

            bullets.splice(j, 1);

            // Zniszczenie wroga
            if (en.hp <= 0) {
              enemiesKilled++;
              const isHeavy = en.maxHp >= 5;
              createExplosion(en.x, en.y, en.color, isHeavy ? 26 : 14, isHeavy);
              score += en.scoreVal;

              // Transporter zawsze upuszcza ulepszenie
              if (en.hasUpgrade) {
                pickups.push({ x: en.x, y: en.y, vy: 1.8, rot: 0 });
              }

              enemies.splice(i, 1);
              break;
            }
          }
        }

        // Kolizja wroga ze statkiem gracza
        const distPlayer = Math.hypot(player.x - en.x, player.y - en.y);
        if (distPlayer < player.radius + en.radius - 3) {
          createExplosion(player.x, player.y, player.color, 25, true);
          state = 'GAMEOVER';
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('cyber_dodge_hi', highScore);
          }
        }

        // Ucieczka wroga za ekran
        if (en.y > canvas.height + 50) {
          // Jeśli transporter uciekł – ulepszenie przepadło, włączamy retry!
          if (en.hasUpgrade) {
            addFloatingText('TRANSPORTER UCIEKŁ!', canvas.width / 2, canvas.height - 120, '#ff0055');
            retryUpgradeTimer = RETRY_DELAY;
          }
          enemies.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.032;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.02;

        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.fillStyle = ft.color;
        ctx.textAlign = 'center';
        ctx.font = 'bold 15px monospace';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      const progress = Math.min(1, levelTimer / LEVEL_DURATION);
      const barWidth = canvas.width - 40;

      // Pasek postępu poziomu
      ctx.fillStyle = '#141a27';
      ctx.fillRect(20, 16, barWidth, 6);
      ctx.fillStyle = '#00ffcc';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00ffcc';
      ctx.fillRect(20, 16, barWidth * progress, 6);
      ctx.shadowBlur = 0;

      // Znaczniki kamieni milowych na pasku (20%, 40%, 60%, 80%)
      [0.20, 0.40, 0.60, 0.80].forEach(p => {
        ctx.fillStyle = progress >= p ? '#ffffff' : '#445566';
        ctx.fillRect(20 + barWidth * p - 1, 14, 2, 10);
      });

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`POZIOM 1`, 20, 42);

      ctx.textAlign = 'right';
      ctx.fillText(`FALA: ${Math.floor(progress * 100)}%`, canvas.width - 20, 42);

      // Wynik
      ctx.textAlign = 'left';
      ctx.fillText(`SCORE: ${score}`, 20, 68);

      // Wskaźnik broni
      ctx.fillStyle = '#ffea00';
      ctx.fillText(`BROŃ: LVL ${player.weaponLevel}${player.weaponLevel === 5 ? ' (MAX OVERDRIVE)' : ''}`, 20, 90);

      // Jeśli trwa odliczanie retry – mała informacja
      if (retryUpgradeTimer > 0 && player.weaponLevel < player.maxWeaponLevel) {
        ctx.fillStyle = '#ff0055';
        ctx.font = '11px monospace';
        ctx.fillText(`RETRY TRANSPORTERA ZA: ${Math.ceil(retryUpgradeTimer)}s`, 20, 108);
      }

      if (state === 'WARMUP') {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#00ffcc';
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#00ffcc';
        ctx.font = 'bold 26px monospace';
        ctx.fillText('PRZYGOTUJ SIĘ!', canvas.width / 2, canvas.height / 2 - 25);

        ctx.shadowBlur = 0;
        ctx.font = 'bold 36px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`${Math.ceil(warmupTimer)}`, canvas.width / 2, canvas.height / 2 + 25);
        ctx.restore();
      } else if (state === 'WON') {
        ctx.save();
        ctx.fillStyle = '#00ffcc';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00ffcc';
        ctx.font = 'bold 28px monospace';
        ctx.fillText('SEKTOR CZYSTY!', canvas.width / 2, canvas.height / 2 - 40);

        ctx.shadowBlur = 0;
        ctx.font = '18px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Poziom 1 ukończony!`, canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#aaaaaa';
        ctx.fillText(`Zestrzelenia: ${enemiesKilled}`, canvas.width / 2, canvas.height / 2 + 25);
        ctx.fillText(`Zdobyte punkty: ${score}`, canvas.width / 2, canvas.height / 2 + 48);
        ctx.fillText(`Rekord: ${highScore}`, canvas.width / 2, canvas.height / 2 + 70);

        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 16px monospace';
        ctx.fillText('Dotknij ekranu, by zagrać ponownie', canvas.width / 2, canvas.height / 2 + 115);
        ctx.restore();
      } else if (state === 'GAMEOVER') {
        ctx.save();
        ctx.fillStyle = '#ff0055';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff0055';
        ctx.font = 'bold 30px monospace';
        ctx.fillText('KADŁUB ZNISZCZONY', canvas.width / 2, canvas.height / 2 - 40);

        ctx.shadowBlur = 0;
        ctx.font = '18px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Wynik: ${score}`, canvas.width / 2, canvas.height / 2);
        ctx.fillText(`Zestrzelenia: ${enemiesKilled}`, canvas.width / 2, canvas.height / 2 + 22);
        ctx.fillStyle = '#888888';
        ctx.fillText(`Rekord: ${highScore}`, canvas.width / 2, canvas.height / 2 + 46);

        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 15px monospace';
        ctx.fillText('Dotknij ekranu, by spróbować znowu', canvas.width / 2, canvas.height / 2 + 92);
        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
